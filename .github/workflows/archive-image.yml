# Builds the audit shipper's image, so the sidecar that keeps a gateway's audit volume from filling has something
# to run. Tiny and slow-moving: alpine, python3, the aws CLI and two files.
name: archive image

on:
  push:
    branches: [main]
    paths:
      - "interfaces/tools/audit_ship.py"
      - "interfaces/tools/audit_verify.py"
      - "deploy/images/venue-archive.Dockerfile"
      - ".github/workflows/archive-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: archive-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A registry path may not carry capitals and a GitHub owner may; there is no `lower()` in an expression.
      - name: The registry path, lower-cased
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/venue-archive" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/images/venue-archive.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The shipper's own self-test, run in the image that will run it: a tool that cannot check itself where it
      # is deployed is one whose deployment is untested.
      - name: The shipper checks itself in the image
        run: docker run --rm ${{ env.IMAGE }}:${{ github.sha }} --self-test

      - name: Say what was built
        run: |
          {
            echo "### Archive image"
            echo '`${{ env.IMAGE }}:${{ github.sha }}`'
            echo
            echo 'Set `gateway.audit.archive.image.tag` to it.'
          } >> "$GITHUB_STEP_SUMMARY"
