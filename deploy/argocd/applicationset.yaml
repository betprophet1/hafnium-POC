# A venue per pull request (deploy/README.md, an environment per pull request).
#
# ArgoCD watches the repository's open pull requests and keeps one Application — one whole venue, in a namespace of
# its own — for each that asks for one. When the request is closed, or stops asking, the Application goes and the
# namespace goes with it, databases and journal included.
#
# Two things about this file are deliberate and easy to undo by accident:
#
#   - **Environments are opt-in, by the `deploy-env` label.** A node that fits three or four venues cannot give one
#     to every open branch, and an environment nobody asked for is one nobody is looking at. Remove the filter and
#     the next busy week fills the cluster.
#   - **The time limit works by taking that label off, not by deleting anything.** This ApplicationSet owns its
#     Applications: delete one and it is recreated within `requeueAfterSeconds`, which looks like a reaper that does
#     not work and is really a reaper fighting a controller. The CronJob beside this file removes the label, and
#     then ArgoCD tears the environment down itself, which is the only version that stays torn down.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: venue-previews
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          owner: LordNacho
          repo: prediction-exchange
          tokenRef:
            secretName: venue-github-token
            key: token
          # Only the branches that asked. See above. This belongs to the github provider and not to `filters`,
          # which offers only branchMatch, targetBranchMatch and titleMatch — the API server refuses a labels
          # entry there outright, which is how this was found.
          labels: ["deploy-env"]
        # How often the pull requests are read again. Short enough that labelling one feels immediate, long enough
        # not to spend the API rate limit on an idle repository.
        requeueAfterSeconds: 120
  template:
    metadata:
      name: "venue-pr-{{ .number }}"
      labels:
        venue.environment: preview
        venue.pull-request: "{{ .number }}"
      annotations:
        # What the reaper reads to decide how old an environment is. It is the head the environment is *currently*
        # running — this Application is updated in place as the branch moves — so asking GitHub when that commit was
        # made gives the last push, and a branch still being worked on keeps its environment. The Application's own
        # creationTimestamp cannot say that: it is stamped once and never moves again.
        venue.head-sha: "{{ .head_sha }}"
    spec:
      project: venue-previews
      source:
        repoURL: https://github.com/LordNacho/prediction-exchange.git
        targetRevision: "{{ .head_sha }}"
        path: deploy/charts/venue-mini
        helm:
          valueFiles:
            - ../../argocd/preview.yaml
          parameters:
            # The host this venue answers on, which is also the URL the bootstrap will name to the venue's own
            # people (interface 1 README, choosing an environment).
            - name: ingress.enabled
              value: "true"
            # The number and a little of the title, because `pr-4` and `pr-7` are the same address to anyone
            # reading them in a chat window. The title is slugged here rather than used as it is: a DNS label may
            # hold only letters, digits and hyphens (RFC 1123), and a pull request may be called anything at all.
            # ArgoCD offers `branch_slug` but no `title_slug`, so this does it — lower-case, every run of anything
            # else collapsed to one hyphen, trimmed, cut to 24 characters, and trimmed again in case the cut landed
            # on one.
            #
            # The hyphen before the slug lives inside the condition rather than in the text, because a title made
            # only of punctuation slugs to nothing and `pr-7-.venue.example` is not a name. That one falls back to
            # `pr-7` and still works.
            #
            # Renaming a pull request therefore moves its environment: a new name, a new certificate, and the old
            # address stops answering. That is the cost of a readable one, and it is paid by the person who renames
            # it rather than by everyone else reading numbers.
            - name: ingress.host
              value: "{{- $s := regexReplaceAll `[^a-z0-9]+` (lower .title) `-` | trimAll `-` | trunc 24 | trimSuffix `-` -}}pr-{{ .number }}{{ if $s }}-{{ $s }}{{ end }}.venue.example"
            - name: ingress.tls.secretName
              value: preview-venue-tls
            # Without this the Ingress asks for TLS and nothing ever issues a certificate: cert-manager acts on the
            # annotation, not on the presence of a tls block. The dot in the annotation's name is escaped because
            # Helm reads an unescaped one as another level of nesting.
            - name: ingress.annotations.cert-manager\.io/cluster-issuer
              value: letsencrypt
            # Without this the app is refused by the browser before it can do anything at all: the app is served
            # from its own origin and every call to this venue is cross-origin (decision G-15).
            - name: gateway.allowedOrigins
              value: "https://app.venue.example"
            # The image built from this very commit, and the credential to pull it with. Without these a preview
            # deploys the branch's chart against whatever image is already on the node: healthy, convincing and
            # testing the wrong binary. The workflow in .github/workflows/preview-image.yml puts it there, tagged
            # with the same head this Application is rendered from, so the chart and the code move together.
            - name: image.repository
              value: ghcr.io/lordnacho/venue
            - name: image.tag
              value: "{{ .head_sha }}"
            # A tag here is a commit, so it never comes to mean a different image and there is nothing to re-pull;
            # a force-push produces a new head and therefore a new tag, which is a different image again.
            - name: image.pullPolicy
              value: IfNotPresent
            - name: image.pullSecrets[0]
              value: ghcr-pull
            # What this preview says of itself when an app asks it where it may go. Without it the route is not
            # offered here at all, and an app that has been pointed at a preview and is then restarted asks this
            # venue whether the session it is holding is still good, is answered 404, and throws the session away —
            # so a reviewer would be signed out of the branch every time they closed the app (src/venue/session.tsx,
            # the launch path). Naming itself is what makes a preview survive being put down and picked up.
            #
            # It names only itself. A preview runs code nobody has reviewed, and an app trusts this list enough to
            # show its labels beside a password box; a branch that named a venue as "Live" would be asking for a
            # live password on its own terms. Getting back to the live venue is the app's own fallback — the address
            # it was built with — and not this venue's to offer (decision G-20).
            - name: gateway.environments[0].id
              value: "pr-{{ .number }}"
            - name: gateway.environments[0].label
              value: "Pull request {{ .number }}"
            - name: gateway.environments[0].url
              value: "https://{{- $s := regexReplaceAll `[^a-z0-9]+` (lower .title) `-` | trimAll `-` | trunc 24 | trimSuffix `-` -}}pr-{{ .number }}{{ if $s }}-{{ $s }}{{ end }}.venue.example"
            - name: gateway.environments[0].live
              value: "false"
            # How big it is, chosen by label. `deploy-env` asks for an environment; these ask for a particular
            # kind of one, and a pull request that says nothing gets the small default.
            #
            # Named sizes rather than free-form values, because two of these have to move together: the engine's
            # capacity profile decides how much memory it allocates up front, and `launch` wants about 1.5 GiB
            # where the default limit is 512Mi. Set one without the other and the core is killed on startup by the
            # kubelet, which reads as a crash in the branch rather than a preview asked for the wrong shape. A
            # label cannot get that half-right.
            #
            #   env-throughput  the launch engine, room to run it, and the observer that measures it
            #   env-fix         the FIX adapter, which is a second front door and a JVM
            #
            # These were `core.capacity`, `observer.enabled` and `fix.enabled` in preview.yaml. They live here now
            # because a parameter beats a values file, so leaving them there would have meant editing a value that
            # could no longer do anything.
            - name: core.capacity
              value: "{{ if has `env-throughput` .labels }}launch{{ else }}small{{ end }}"
            - name: core.resources.requests.cpu
              value: "{{ if has `env-throughput` .labels }}500m{{ else }}100m{{ end }}"
            - name: core.resources.requests.memory
              value: "{{ if has `env-throughput` .labels }}2Gi{{ else }}256Mi{{ end }}"
            - name: core.resources.limits.memory
              value: "{{ if has `env-throughput` .labels }}3Gi{{ else }}512Mi{{ end }}"
            - name: observer.enabled
              value: "{{ if has `env-throughput` .labels }}true{{ else }}false{{ end }}"
            - name: fix.enabled
              value: "{{ if has `env-fix` .labels }}true{{ else }}false{{ end }}"
            # What the environment calls itself in its metrics, so a dashboard can tell one branch from another.
            - name: metrics.labels.environment
              value: "pr-{{ .number }}"
            - name: metrics.labels.profile
              value: preview
      destination:
        server: https://kubernetes.default.svc
        namespace: "venue-pr-{{ .number }}"
      syncPolicy:
        automated:
          # Both on purpose. A preview environment is worth nothing if it does not follow the branch, and a namespace
          # left behind after its pull request closed is worth less than nothing.
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # The migrate job is a pre-upgrade hook and the chart's own; leaving its history behind fills the namespace
          # with completed pods for no one's benefit.
          - PruneLast=true
