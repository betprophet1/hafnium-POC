# Puts the registry credential into each preview's namespace, because nothing else can.
#
# A preview pulls an image built from its own commit, which means a private package, which means an imagePullSecret
# in the namespace the pods run in. That namespace does not exist until ArgoCD makes it, so the secret cannot be
# created ahead of time, and it cannot come from the chart either — the chart is public and a credential in it would
# be too.
#
# **Why this is not part of the reaper**, which is the other thing here on a schedule. The reaper is deliberately
# read-only: its Role grants `get` and `list` on Applications and nothing else, so that a bug in it cannot take an
# environment down directly (see the note in reaper.yaml). Handing it the ability to write Secrets across the
# cluster would give that away for an unrelated job. It also runs every half hour, and a pod that cannot pull its
# image needs the credential within a minute, not within thirty.
#
# What it may do is deliberately small: list namespaces, and *create* Secrets. It cannot read a Secret, list one, or
# change one that exists — so it cannot be used to look at anything, and re-running it over a namespace that already
# has the credential is a no-op that fails harmlessly. The credential it copies reaches it the same way any pod
# gets one, through the kubelet, so it needs no permission to read the source at all.
#
# A consequence worth knowing: because it only creates, rotating the registry token does not reach namespaces that
# already have the old one. Previews live eight hours at most, so the next one picks the new token up; nothing has
# to be migrated.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: venue-pull-secret
  namespace: argocd
spec:
  # Every minute. A pod whose image will not pull backs off for up to five, so a credential arriving within one is
  # the difference between a preview that comes up by itself and one somebody has to go and poke.
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: venue-pull-secret
          containers:
            - name: copier
              image: alpine/k8s:1.31.1
              env:
                # The kubelet reads this, not the job: nothing here has permission to read a Secret, and it does not
                # need any to be handed this one.
                - name: DOCKERCONFIG
                  valueFrom:
                    secretKeyRef:
                      name: ghcr-pull
                      key: .dockerconfigjson
              command: ["/bin/sh", "-euo", "pipefail", "-c"]
              args:
                - |
                  # Namespaces ArgoCD made for a preview. The name is the ApplicationSet's, so matching on it is
                  # matching on the thing that created them rather than on a label somebody could put anywhere.
                  # `|| true` because no previews is the ordinary state, not a fault. grep exits 1 when it matches
                  # nothing, and under `pipefail` that failed the job — so with no pull request open this errored
                  # every minute and left a cluster in perfect health looking like one that was not.
                  kubectl get namespace -o name \
                    | sed 's|^namespace/||' \
                    | { grep '^venue-pr-' || true; } \
                    | while read -r ns; do
                        # `create` rather than `apply`: apply would need to read the Secret first, and not being
                        # able to read Secrets is the point. A namespace that already has it says AlreadyExists,
                        # which is the normal case and not a failure.
                        if kubectl create secret generic ghcr-pull \
                             --namespace "$ns" \
                             --type=kubernetes.io/dockerconfigjson \
                             --from-literal=.dockerconfigjson="$DOCKERCONFIG" 2>/dev/null; then
                          echo "$ns: credential put in place"
                        else
                          echo "$ns: already had it"
                        fi
                      done
                  echo "done"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: venue-pull-secret
  namespace: argocd
---
# Namespaces must be listed cluster-wide to be found at all, and a Secret has to be created in a namespace that did
# not exist when this was written, so the create cannot be confined to one either. Everything else is withheld:
# without `get` or `list` on Secrets this cannot read one anywhere, including the one it is itself given, and
# without `update`, `patch` or `delete` it cannot touch a Secret already in place.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: venue-pull-secret
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: venue-pull-secret
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: venue-pull-secret
subjects:
  - kind: ServiceAccount
    name: venue-pull-secret
    namespace: argocd
