# What a pull request's venue is allowed to be (deploy/README.md, an environment per pull request).
#
# This is the boundary, and it is the reason previews are a separate project rather than sharing the live venue's.
# An Application built from a pull request is built from **code nobody has reviewed yet** — that is what a pull
# request is — and ArgoCD will deploy whatever the chart in that branch says. Without a project saying otherwise, a
# branch could change the chart to deploy into the live namespace, or to make cluster-wide objects, and ArgoCD would
# do it faithfully. The list below is what stops that, and it is the only thing that stops it.
#
# It stops it at sync rather than at admission. ArgoCD has no admission webhook for destinations, so an Application
# aimed at a namespace it may not have is created without complaint and then simply never syncs, carrying an
# `InvalidSpecError` that names the project and the destination. Nothing is deployed, which is what matters — but
# somebody looking for a rejected apply will not find one, so look at the Application's conditions instead.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: venue-previews
  namespace: argocd
spec:
  description: One venue per pull request, each in a namespace of its own and nowhere else.
  sourceRepos:
    - https://github.com/YOUR_GITHUB_ORG/prediction-exchange.git  # was: LordNacho
  # Namespaces of its own, and no others. Not the live venue's, not argocd's, not kube-system.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "venue-pr-*"
  # One cluster-scoped kind, and one only: the Namespace a preview lives in, which `CreateNamespace=true` has to
  # make before anything else can go into it. An empty list here is what you first reach for and it does not work —
  # every sync fails with "resource :Namespace is not permitted in project venue-previews", which reads like a
  # destination problem and is not one. Measured, on venue-pr-1.
  #
  # Everything else cluster-scoped stays refused, which is the part that matters: no ClusterRole, no
  # ClusterRoleBinding, no CRD, no webhook, no PersistentVolume. A branch cannot grant itself anything outside its
  # own namespace, and so cannot reach the live venue or read the token in argocd.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  # `permitOnlyProjectScopedClusters` is deliberately NOT set. It sounds like what is wanted here and is not: it
  # requires every destination cluster to be a cluster secret explicitly scoped to this project, and the built-in
  # in-cluster destination is not one — so with it on, every preview is refused with an InvalidSpecError naming a
  # destination that plainly is in the list above. Measured, after it refused venue-pr-1. The confinement that
  # matters is `destinations` and the empty `clusterResourceWhitelist`, both of which are doing their job.
  roles:
    - name: read-only
      description: Seeing what a preview is doing, without being able to change it.
      policies:
        - p, proj:venue-previews:read-only, applications, get, venue-previews/*, allow
