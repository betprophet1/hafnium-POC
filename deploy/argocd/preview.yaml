# What a pull request's venue is, on top of the chart's defaults: everything a reviewer needs to open the page, sign
# in and trade, and nothing that only matters when a venue is meant to stay up.
#
# The point is footprint. A full environment asks for about 1150m of CPU and 3.1 GiB of memory, so a node with six
# cores and 15 GiB fits three or four of them beside whatever else it is doing. Trimming here is what decides how
# many branches can be looked at on one afternoon, so each thing left out is left out for a stated reason rather
# than because it seemed large.

# The volumes go when the environment does. A preview's namespace is thrown away with its pull request, and a
# journal and a database left behind each time would fill the node a gigabyte at a time — which is exactly what
# happened the first time this was run, and is why these are here.
core:
  # The smallest engine: 16k resting orders and about 90 MiB. A branch is reviewed, not load-tested; a branch that
  # is about capacity says so by overriding this itself.
  capacity: small
  storage:
    keepOnDelete: false
postgres:
  # Known passwords, in the open, on purpose.
  #
  # A preview's database has to have a password the chart can produce identically on every render, or ArgoCD invents
  # a new one each reconcile and PostgreSQL — still wanting the one it was initialised with — refuses every service
  # (deploy/README.md). Giving them here makes the rendered Secret deterministic, which is what lets ArgoCD manage it
  # honestly rather than be told to ignore it.
  #
  # These are safe here and nowhere else. A preview holds no money, no member and no personal data; it is reachable
  # only inside its own namespace, and it is destroyed with its pull request. **A venue anybody relies on must never
  # take these values**: it names a Secret made outside the chart with `postgres.existingSecret` instead. Nothing
  # enforces that but this comment and the fact that this file is only ever read by the preview ApplicationSet.
  passwords:
    postgres-password: preview-only-not-a-secret-postgres
    identity-password: preview-only-not-a-secret-identity
    treasury-password: preview-only-not-a-secret-treasury
    parlays-password: preview-only-not-a-secret-parlays
    oracle-password: preview-only-not-a-secret-oracle
  storage:
    keepOnDelete: false

# The synthetic traders stay. A venue with an empty book tells a reviewer nothing — no prices, no fills, nothing to
# trade against — and they are the cheapest part of the deployment.
maker:
  enabled: true
taker:
  enabled: true

# The oracle stays too: without it nothing ever settles, and settlement is where most of the interesting bugs are.
oracle:
  enabled: true

# The FIX adapter goes. It is a second front door onto the same venue, it needs a JVM, and a reviewer who wants it
# turns it on for their own branch.
fix:
  enabled: false

# So does the observer, which exists to watch an environment over time. Nobody watches a preview over time.
observer:
  enabled: false

# Mail is readable here, because there is no mail provider and the codes that prove an address have to reach
# somebody (decision G-19). It is the same reasoning as the demo, and the same warning: never where an address could
# really receive them.
identity:
  showMail: true

# One of each half. The split is kept rather than collapsed to a single gateway, because the halves are part of what
# a reviewer is looking at, and two small pods cost less than the surprise of reviewing a shape that is not the one
# that runs.
gateway:
  split:
    public:
      replicas: 1
    private:
      replicas: 1
