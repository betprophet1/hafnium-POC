# grafana/alloy (version in ../versions.env): one collector per node that tails the log files of that node's pods
# (/var/log/pods, mounted read-only) and ships them to Loki. Files rather than the Kubernetes API: following logs
# through the API costs the kubelet an inotify instance per container, and a laptop's default of 128
# (fs.inotify.max_user_instances) runs out with a venue or two and this stack ("failed to create fsnotify watcher");
# the file source polls instead.
#
# Where logs go is configuration: LOKI_WRITE_URL below, in-cluster Loki by default. For a Loki that needs credentials
# (Grafana Cloud, a gateway with auth), set LOKI_USERNAME and LOKI_PASSWORD from a Secret (README.md, managed services);
# with both empty no credentials are sent.

fullnameOverride: alloy

controller:
  type: daemonset

alloy:
  enableReporting: false
  mounts:
    varlog: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: LOKI_WRITE_URL
      value: http://loki.monitoring.svc:3100/loki/api/v1/push
    - name: LOKI_USERNAME
      value: ""
    - name: LOKI_PASSWORD
      value: ""
    # Every stream carries the cluster it came from, as Prometheus's external label does.
    - name: CLUSTER_NAME
      value: local
  configMap:
    create: true
    content: |
      // Pods on this node only: each node's collector tails its own.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
          target_label  = "component"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
          target_label  = "release"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // The container's log files: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log.
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          regex         = "(.*)/(.*)/(.*)/(.*)"
          replacement   = "/var/log/pods/${1}_${2}_${3}/${4}/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.venue.receiver]
      }

      // The venue's processes log JSON lines (deploy/observability/metrics.md, logs): level and service become labels,
      // both from small fixed sets. Everything else stays in the line, for | json in LogQL.
      loki.process "venue" {
        // Each file line is the container runtime's: time, stream, flags, then what the process wrote.
        stage.cri {}
        stage.match {
          selector = "{app=\"venue-mini\"}"
          stage.json {
            expressions = { level = "level", service = "service" }
          }
          stage.labels {
            values = { level = "", service = "" }
          }
        }
        stage.static_labels {
          values = { cluster = sys.env("CLUSTER_NAME") }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = sys.env("LOKI_WRITE_URL")
          basic_auth {
            username = sys.env("LOKI_USERNAME")
            password = sys.env("LOKI_PASSWORD")
          }
        }
      }
