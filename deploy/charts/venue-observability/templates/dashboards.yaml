{{- if .Values.dashboards.enabled }}
{{- range $folder := list "system" "business" }}
{{- range $path, $_ := $.Files.Glob (printf "dashboards/%s/*.json" $folder) }}
---
# {{ $path }}, for Grafana's sidecar (label grafana_dashboard), in the folder its annotation names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s-%s" $.Release.Name $folder (base $path | trimSuffix ".json") | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "venue-observability.labels" $ | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ title $folder | quote }}
data:
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
