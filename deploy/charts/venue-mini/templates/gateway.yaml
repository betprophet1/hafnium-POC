{{- $name := include "venue-mini.fullname" . }}
{{- $core := printf "%s-core" $name }}
{{- if not .Values.gateway.split.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-gateway
  labels:
    {{- include "venue-mini.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector:
    {{- include "venue-mini.selector" (dict "ctx" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8081
      targetPort: http
---
# The gateway's audit log (interfaces/audit): every request and what it was answered, refusals above all. It outlives
# the pod, and a gateway that cannot write it does not run. Nothing ships it to retained storage yet.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-gateway-audit
  labels:
    {{- include "venue-mini.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.gateway.audit.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.gateway.audit.storage.size }}
---
# Interface 1, the REST and WebSocket gateway (interfaces/gateway): the only client-facing way into the core. One
# writer to its audit volume, so an old pod stops before a new one starts; the new one seals a file the old one left
# open, which it can because they share an instance name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-gateway
  labels:
    {{- include "venue-mini.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "venue-mini.selector" (dict "ctx" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "venue-mini.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      {{- include "venue-mini.gatewayPod" (dict "ctx" . "serve" "both") | nindent 6 }}
      volumes:
        - name: catalogue
          configMap:
            name: {{ $name }}-catalogue
        - name: audit
          persistentVolumeClaim:
            claimName: {{ $name }}-gateway-audit
{{- else }}
{{- range $half := list "public" "private" }}
{{- $replicas := index $.Values.gateway.split $half "replicas" }}
---
# The gateway's {{ $half }} half on its own (interfaces/gateway/README.md, public and private), for clients that
# address it by this Service: {{ if eq $half "public" }}/v4/ws_public and /v4/markets{{ else }}/v4/ws_private, /v4/account, /v4/orders, /v4/transfers, /v4/rfqs and /v4/keys{{ end }}.
# A WebSocket stays on the pod it connected to, and a REST call needs no pod in particular, so no session affinity.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-gateway-{{ $half }}
  labels:
    {{- include "venue-mini.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector:
    {{- include "venue-mini.selector" (dict "ctx" $ "component" "gateway") | nindent 4 }}
    venue-mini/gateway-half: {{ $half }}
  ports:
    - name: http
      port: 8081
      targetPort: http
---
# {{ $replicas }} gateway processes serving the {{ $half }} half. Each pod writes its own audit instance, named for the
# pod, on a volume of its own: a pod replaced under the same name seals the file its predecessor left open, and no two
# live pods ever write one instance.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-gateway-{{ $half }}
  labels:
    {{- include "venue-mini.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  serviceName: {{ $name }}-gateway-{{ $half }}
  replicas: {{ $replicas }}
  podManagementPolicy: Parallel
  # Scaling down keeps the audit volumes of the pods it removes: the audit log is kept, not a cache. A pod of the same
  # name, when the half scales up again, takes its volume back and seals the file its predecessor left open.
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Retain
    whenDeleted: Retain
  selector:
    matchLabels:
      {{- include "venue-mini.selector" (dict "ctx" $ "component" "gateway") | nindent 6 }}
      venue-mini/gateway-half: {{ $half }}
  template:
    metadata:
      labels:
        {{- include "venue-mini.labels" $ | nindent 8 }}
        app.kubernetes.io/component: gateway
        venue-mini/gateway-half: {{ $half }}
    spec:
      {{- include "venue-mini.gatewayPod" (dict "ctx" $ "serve" $half) | nindent 6 }}
      volumes:
        - name: catalogue
          configMap:
            name: {{ $name }}-catalogue
  volumeClaimTemplates:
    - metadata:
        name: audit
        labels:
          {{- include "venue-mini.labels" $ | nindent 10 }}
          app.kubernetes.io/component: gateway
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $.Values.gateway.audit.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $.Values.gateway.audit.storage.size }}
{{- end }}
{{- end }}
---
# Only the gateway, the treasury, the operator tools (seed job, parlay service, dummy oracle, the web page's event
# list) and the core's own smoke test may reach the core's ingress and feed. Everything a customer or bot does goes
# through the gateway (blueprint §16).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $core }}
  labels:
    {{- include "venue-mini.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "venue-mini.coreSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range list "gateway" "treasury" "web" "seed" "parlays" "smoke" "oracle" }}
        - podSelector:
            matchLabels:
              {{- include "venue-mini.selector" (dict "ctx" $ "component" .) | nindent 14 }}
        {{- end }}
      ports:
        - port: 7101
        - port: 7102
