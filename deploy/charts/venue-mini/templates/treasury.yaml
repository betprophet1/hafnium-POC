{{- if .Values.treasury.enabled }}
{{- $name := include "venue-mini.fullname" . }}
{{- $core := printf "%s-core" $name }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-treasury
  labels:
    {{- include "venue-mini.labels" . | nindent 4 }}
    app.kubernetes.io/component: treasury
spec:
  selector:
    {{- include "venue-mini.selector" (dict "ctx" . "component" "treasury") | nindent 4 }}
  ports:
    - name: http
      port: 8083
      targetPort: http
---
# The dummy treasury (core/treasury): deposits and withdrawals, a double-entry ledger and a fake bank, its records in
# PostgreSQL. One writer to its records, so an old pod stops before a new one starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-treasury
  labels:
    {{- include "venue-mini.labels" . | nindent 4 }}
    app.kubernetes.io/component: treasury
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "venue-mini.selector" (dict "ctx" . "component" "treasury") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "venue-mini.labels" . | nindent 8 }}
        app.kubernetes.io/component: treasury
    spec:
      {{- include "venue-mini.imagePullSecrets" . | trim | nindent 6 }}
      securityContext:
        {{- include "venue-mini.podSecurity" . | nindent 8 }}
      containers:
        - name: treasury
          image: {{ include "venue-mini.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["tini", "--", "venue-treasury"]
          env:
            - name: VENUE_LISTEN
              value: "0.0.0.0:8083"
            - name: VENUE_INGRESS
              value: "{{ $core }}:7101"
            - name: VENUE_FEED
              value: "{{ $core }}:7102"
            - name: VENUE_CATALOGUE
              value: /catalogue/markets.json
            {{- include "venue-mini.databaseEnv" (dict "ctx" . "service" "treasury") | trim | nindent 12 }}
            - name: VENUE_SEED
              value: {{ .Values.treasury.bank.seed | int64 | quote }}
            - name: VENUE_MIN_DELAY_MS
              value: {{ .Values.treasury.bank.minDelayMs | int64 | quote }}
            - name: VENUE_MAX_DELAY_MS
              value: {{ .Values.treasury.bank.maxDelayMs | int64 | quote }}
            - name: VENUE_FAILURE_PER_MILLE
              value: {{ .Values.treasury.bank.failurePerMille | int64 | quote }}
            - name: VENUE_MAX_CENTS
              value: {{ .Values.treasury.maxCents | int64 | quote }}
            - name: VENUE_FAULTS
              value: {{ .Values.treasury.faults | quote }}
            - name: VENUE_RECONCILE_EVERY_MS
              value: {{ .Values.treasury.reconciliation.everyMs | int64 | quote }}
            - name: VENUE_RECONCILE_GRACE_MS
              value: {{ .Values.treasury.reconciliation.graceMs | int64 | quote }}
          ports:
            - name: http
              containerPort: 8083
          # Ready while its records answer: without them it can take no transfer, and the gateway answers 503.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            {{- include "venue-mini.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: catalogue
              mountPath: /catalogue
            {{- include "venue-mini.databaseCaMount" . | trim | nindent 12 }}
      volumes:
        - name: catalogue
          configMap:
            name: {{ $name }}-catalogue
        {{- include "venue-mini.databaseCaVolume" . | trim | nindent 8 }}
---
# The treasury trusts the account a request names, because only the gateway's private half, which authenticated it,
# may reach it. The web page reaches it too, but passes through only the reconciliation summary and a run on demand.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-treasury
  labels:
    {{- include "venue-mini.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "venue-mini.selector" (dict "ctx" . "component" "treasury") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "venue-mini.selector" (dict "ctx" $ "component" "gateway") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "venue-mini.selector" (dict "ctx" $ "component" "web") | nindent 14 }}
      ports:
        - port: 8083
{{- end }}
