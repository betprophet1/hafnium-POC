{{- $name := include "venue-mini.fullname" . }}
{{- $services := splitList " " (include "venue-mini.databaseServices" .) | compact }}
{{- if $services }}
{{- /* Before the in-cluster server exists (a first install, or an upgrade that turns it on) a hook could only wait for it. */}}
{{- $first := and .Values.postgres.enabled (not (lookup "apps/v1" "StatefulSet" .Release.Namespace (printf "%s-postgres" $name))) }}
# Each service's schema migrations (core/store/README.md), run before the services need them: a pre-install and
# pre-upgrade hook, except while an in-cluster PostgreSQL does not exist yet (the release that creates it): there the
# job runs beside it, and the services wait until their schemas are current. Every migration run takes
# an advisory lock, so a run repeated or overlapping changes nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate{{ if $first }}-first{{ end }}
  labels:
    {{- include "venue-mini.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  {{- if not $first }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "venue-mini.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- include "venue-mini.podSecurity" . | nindent 8 }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        # Each service's role, database and schema, made if missing, with the role's password kept as the Secret says.
        - name: bootstrap
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/bootstrap/bootstrap.sh"]
          env:
            - name: PGHOST
              value: {{ $name }}-postgres
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "venue-mini.postgresSecret" . }}
                  key: postgres-password
          securityContext:
            {{- include "venue-mini.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
            - name: passwords
              mountPath: /etc/venue/postgres
              readOnly: true
      {{- end }}
      containers:
        {{- range $service := $services }}
        - name: {{ $service }}
          image: {{ include "venue-mini.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          # Atlas applies them (core/store/decisions.md, S-2), from the files in the image, keeping its history in the
          # service's own schema. A run repeated or overlapping changes nothing: it takes its own lock and applies only
          # what is missing. The URL is the service's own with the schema and TLS it uses added, so that Atlas connects
          # exactly where the service will.
          command: ["tini", "--", "sh", "-c"]
          args:
            - |
              set -eu
              case "$VENUE_DATABASE_URL" in *\?*) sep='&' ;; *) sep='?' ;; esac
              url="${VENUE_DATABASE_URL}${sep}search_path=${VENUE_DATABASE_SCHEMA}&sslmode=${VENUE_DATABASE_TLS:-prefer}"
              if [ -n "${VENUE_DATABASE_CA_FILE:-}" ]; then url="${url}&sslrootcert=${VENUE_DATABASE_CA_FILE}"; fi
              exec atlas migrate apply \
                --dir "file:///usr/share/venue/migrations/{{ $service }}" \
                --url "$url" \
                --revisions-schema "$VENUE_DATABASE_SCHEMA" \
                --lock-timeout {{ $.Values.migrations.lockTimeout | quote }}
          env:
            {{- include "venue-mini.databaseEnv" (dict "ctx" $ "service" $service) | trim | nindent 12 }}
          securityContext:
            {{- include "venue-mini.containerSecurity" $ | nindent 12 }}
          {{- if and (not $.Values.postgres.enabled) $.Values.database.caSecret }}
          volumeMounts:
            {{- include "venue-mini.databaseCaMount" $ | trim | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        {{- if .Values.postgres.enabled }}
        - name: bootstrap
          configMap:
            name: {{ $name }}-postgres-bootstrap
        - name: passwords
          secret:
            secretName: {{ include "venue-mini.postgresSecret" . }}
        {{- end }}
        {{- include "venue-mini.databaseCaVolume" . | trim | nindent 8 }}
{{- end }}
