{{- if .Values.parlays.enabled }}
{{- $name := include "venue-mini.fullname" . }}
{{- $core := printf "%s-core" $name }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-parlays
  labels:
    {{- include "venue-mini.labels" . | nindent 4 }}
    app.kubernetes.io/component: parlays
spec:
  selector:
    {{- include "venue-mini.selector" (dict "ctx" . "component" "parlays") | nindent 4 }}
  ports:
    - name: gateways
      port: 7103
      targetPort: gateways
    # The operator API: approving and revoking responders. Like the oracle's control API, unauthenticated; never
    # expose it outside the cluster.
    - name: operator
      port: 7104
      targetPort: operator
---
# The approved responders outlive the pod: an operator's approvals and revocations should not quietly revert to the
# catalogue's list when the pod is replaced.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-parlays
  labels:
    {{- include "venue-mini.labels" . | nindent 4 }}
    app.kubernetes.io/component: parlays
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.parlays.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.parlays.storage.size }}
---
# The parlay service (core/parlays): lists a parlay on its first request for quote, relays requests to the subscribed
# sessions of approved responders and their quotes to the requester through the gateway, and settles parlays from
# their legs. It sequences as an operator, like the seed job, and holds open requests and subscriptions in memory:
# replacing its pod forgets them (the gateway subscribes its sessions again), while parlays and quotes, which are
# listings and orders, stay in the journal, and the approved responders stay in their file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-parlays
  labels:
    {{- include "venue-mini.labels" . | nindent 4 }}
    app.kubernetes.io/component: parlays
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "venue-mini.selector" (dict "ctx" . "component" "parlays") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "venue-mini.labels" . | nindent 8 }}
        app.kubernetes.io/component: parlays
    spec:
      securityContext:
        {{- include "venue-mini.podSecurity" . | nindent 8 }}
      containers:
        - name: parlays
          image: {{ include "venue-mini.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["tini", "--", "venue-parlays"]
          env:
            - name: VENUE_LISTEN
              value: "0.0.0.0:7103"
            - name: VENUE_INGRESS
              value: "{{ $core }}:7101"
            - name: VENUE_FEED
              value: "{{ $core }}:7102"
            - name: VENUE_CATALOGUE
              value: /catalogue/markets.json
            - name: VENUE_WINDOW_SECONDS
              value: {{ .Values.parlays.windowSeconds | quote }}
            - name: VENUE_MAX_PARLAYS
              value: {{ .Values.parlays.maxParlays | quote }}
            # No parlay is listed that would take the core past 95% of its profile, which the oracle's rounds share.
            - name: VENUE_CAPACITY
              value: {{ .Values.core.capacity | quote }}
            - name: VENUE_RESPONDERS
              value: /var/lib/parlays/responders.json
            - name: VENUE_OPERATOR
              value: "0.0.0.0:7104"
            - name: VENUE_MIN_QUANTITY
              value: {{ .Values.parlays.minQuantity | quote }}
          ports:
            - name: gateways
              containerPort: 7103
            - name: operator
              containerPort: 7104
          readinessProbe:
            tcpSocket:
              port: gateways
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            {{- include "venue-mini.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: catalogue
              mountPath: /catalogue
            - name: responders
              mountPath: /var/lib/parlays
      volumes:
        - name: catalogue
          configMap:
            name: {{ $name }}-catalogue
        - name: responders
          persistentVolumeClaim:
            claimName: {{ $name }}-parlays
{{- end }}
