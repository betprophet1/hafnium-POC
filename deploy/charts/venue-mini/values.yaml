# The mini venue (blueprint §16): one chart for the laptop and for ephemeral namespaces.
# It runs the core, the demo markets, synthetic traders, the dummy oracle and a web page. The gateway and the
# environment manifest join as they are built.

# Where the pods may run. Empty means anywhere, which is right for one node and for a cluster nobody has divided up.
#
# A node kept for preview environments is a taint on the node and these two here: the taint is what stops anything
# else landing on it, and the toleration is what lets a preview past the taint. Both are needed — a nodeSelector
# alone would send previews to that node without stopping the live venue following them there.
scheduling:
  nodeSelector: {}
  tolerations: []

image:
  # One image holds venue-node, venue-gateway and venue-sim, each run under tini.
  repository: venue
  tag: dev
  pullPolicy: IfNotPresent
  # Secrets to pull with, for a registry that asks. Empty for a venue whose image was built and imported by hand,
  # which is what the laptop script does; a preview names one, because it pulls its own branch's build from a
  # private registry (deploy/README.md, an image per pull request).
  pullSecrets: []

core:
  # One sequencer group, one node. Order and trade IDs carry the group (spec E-2.8).
  group: 1
  nodeId: 1
  # TimeTick cadence (spec E-17.3). Production uses 1 ms; an idle laptop does not need a thousand records a second.
  tickMs: 100
  # Engine capacity profile: small (16k resting orders, ~90 MiB), launch (262k, ~1.5 GiB) or scale (1M, ~6 GiB).
  # The node refuses a journal recorded under another profile, and the seed sets the order limit beneath this one's
  # order ceiling, so both read it from here.
  capacity: small
  # fsync the journal after every input. Off on laptops; the journal is still flushed before each input applies.
  fsync: false
  # A snapshot **pair** of the live venue, taken and published on a schedule. Off by default: it needs somewhere
  # to put them and a role that may write there.
  #
  # Nothing is embedded, nothing is cut, nothing is deleted and the venue is not stopped. The pair is computed by
  # replaying the journal into a throwaway engine, and the replay stops at the sequence asked for, so it never
  # reads the tail the node is still appending to — which is why the volume can be mounted read-only. Embedding a
  # snapshot and cutting the journal are the operations that need the writer stopped; taking one does not.
  #
  # What this buys: a test or preview environment can be founded on any published pair
  # (`snapshot_fetch.py` + `venue-node seed` + `--from-view`), instead of only on genesis.
  snapshots:
    enabled: false
    # Daily, offset from the audit shipper (:17) and the database archiver (02:43).
    schedule: "13 3 * * *"
    # s3://bucket[/prefix], or a directory for a demo. Keys are snapshots/{environment}/{stamp}.{engine,view}.*
    to: ""
    # Which venue these pairs belong to: prod, pr-4. Names part of the key.
    environment: ""
    region: eu-central-1
    # The replay is a real engine at this venue's capacity profile, not a tool's working set — give it what the
    # core itself gets, or the job is OOM-killed at a size that looks arbitrary.
    replayMemory: 512Mi
    # The pair, held between the two containers. An engine half is hundreds of KB and grows with the venue.
    pairSize: 512Mi
    scratchSize: 1Gi
    image:
      # The publisher half: the archive image already carries snapshot_publish.py and the AWS CLI. The *taking*
      # half runs the venue image, which carries venue-view.
      repository: ghcr.io/your-github-org/venue-dbarchive  # was: lordnacho
      tag: ""
      pullPolicy: IfNotPresent
      pullSecrets: []
  storage:
    size: 1Gi
    # Whether the volume outlives the StatefulSet. True everywhere that matters: deleting a release must not take the
    # journal or the ledger with it, and a volume kept by mistake costs a little disk while one deleted by mistake
    # costs everything. A preview environment sets it false, because its whole namespace is thrown away with its
    # pull request and volumes left behind would pile up a gigabyte at a time (deploy/argocd/preview.yaml).
    keepOnDelete: true
    # Empty uses the cluster's default class (k3d: local-path).
    className: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# The order book, market maker, retail customer, account and settlement tabs. Reach it with deploy/laptop.sh web.
web:
  enabled: true

# The dummy treasury (core/treasury): deposits and withdrawals on the gateway's private half (/v4/transfers), a
# double-entry ledger kept in its PostgreSQL database (database.treasury), and a fake bank. Without it the page's account tab cannot move money
# and /v4/transfers answers 503.
treasury:
  enabled: true
  bank:
    # dummy_bank transfers are decided after a delay drawn from this range, and this many in a thousand fail. The
    # decisions depend only on the seed and the transfer, so a run can be repeated.
    seed: 1
    minDelayMs: 2000
    maxDelayMs: 8000
    failurePerMille: 100
  # The largest single transfer, in cents: $1,000,000.
  maxCents: 100000000
  # Messages lost on purpose so reconciliation has something to find (core/treasury/README.md): none, or demo for a
  # few percent of bank notices and sleeve-adjustment answers lost, late or duplicated.
  faults: none
  # Reconciliation against the fake bank's statement and the journal, every everyMs (0: only when asked); a bank
  # decision younger than graceMs is in flight, not a break. The page's account tab shows the last run.
  reconciliation:
    everyMs: 60000
    graceMs: 10000
# The identity service of test environments (core/identity): the environment's accounts and their API keys with
# permissions, made, listed and revoked on the gateway's private half (/v4/keys) and kept in its PostgreSQL database
# (database.identity). Without it the gateway refuses keys and only the catalogue's dev tokens work. Test environments
# only: production identity is interface 6.
identity:
  enabled: true
  # Answers GET /v4/mail with the mail this venue would have sent, which the page'"'"'s members tab reads so the codes that
  # prove an address and set a password reach somebody: there is no mail provider here, as there is no real bank
  # (interfaces/gateway/decisions.md, G-19). A venue whose addresses are real must leave this false — the messages
  # hold the codes themselves.
  showMail: true
# The dummy oracle: lists a new round of each demo market on the calendar in files/calendar.json, runs it (start,
# sometimes a suspension, end, close) and settles it through proposal, auto-approval and a dispute window, voiding one
# now and then. The settlement tab drives it. Off, the markets the seed lists stay open until someone settles them.
# The seed has the engine release a settled round half an hour after it resolves, so the calendar runs indefinitely
# on the small capacity profile. Its resolution cases, and what operators did by hand, are kept in its PostgreSQL
# database (database.oracle), so a replaced pod carries on where it was.
oracle:
  enabled: true

# PostgreSQL for the services' records (core/store): the treasury, identity, parlay and oracle services each own a
# database and a role of their own, and only they, and the migrate job, may reach it (network policy). Either this
# chart runs one server for all of them (postgres.enabled), or each service is given the URL of a database elsewhere,
# self-hosted or managed (RDS, Aurora), under database.<service>: the code is the same either way.
postgres:
  # true: a PostgreSQL StatefulSet of one, on a volume of its own, with a database, role and password per service
  # generated into the Secret <release>-postgres (kept across upgrades) unless existingSecret names one.
  enabled: true
  image:
    repository: postgres
    # Pinned by tag and digest, as ./check's test database is.
    tag: 18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
  # A Secret of your own instead of the generated one, with keys postgres-password and <service>-password for each
  # service (treasury, identity, parlays, oracle).
  existingSecret: ""
  # Passwords, given rather than generated. Empty means the chart makes them, which needs a real `helm install` or
  # `helm upgrade` — see the note in templates/postgres.yaml. Anything ArgoCD deploys must set these, or name a
  # Secret it did not make with `existingSecret`.
  #
  # Whatever is put here is as secret as the file it is written in. A repository is not a secret.
  passwords: {}
  storage:
    size: 1Gi
    # Whether the volume outlives the StatefulSet. True everywhere that matters: deleting a release must not take the
    # journal or the ledger with it, and a volume kept by mistake costs a little disk while one deleted by mistake
    # costs everything. A preview environment sets it false, because its whole namespace is thrown away with its
    # pull request and volumes left behind would pile up a gigabyte at a time (deploy/argocd/preview.yaml).
    keepOnDelete: true
    # Empty uses the cluster's default class (k3d: local-path).
    className: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Where each service's database is when postgres.enabled is false: a URL (postgres://USER:PASSWORD@HOST:5432/DB),
# given inline (the chart keeps it in a Secret) or as a key of an existing Secret. Nothing else changes between an
# in-cluster, self-hosted or managed database.
database:
  # TLS for external databases (core/store/README.md): disable, prefer, require, verify-ca or verify-full. Managed
  # databases: verify-full, with the provider's CA bundle in caSecret. This setting overrides a URL's own sslmode.
  tls: verify-full
  # A Secret with the CA bundle under the key ca.pem, mounted into every service that reaches a database; empty uses the
  # image's system CAs.
  caSecret: ""
  # Connections each service opens at most.
  poolSize: 4
  # A verified `pg_dump` of each database to object storage, on a schedule. Off by default: it needs somewhere to
  # put them and a role that may write there.
  #
  # This copies and never deletes — from the database or from the bucket. The databases are append-only by
  # construction (a trigger on each refuses DELETE and TRUNCATE) and they are small: all four held about 4 MB
  # after half a day of trading on 2026-09-25, against the engine journal's 35 MB/hour. The gap this fills is
  # that they had no copy anywhere, not that they were filling anything up. Removing rows on an age rule is
  # interface 29, planned and unbuilt.
  #
  # **A dump of `identity` contains the venue's only personal data** (`members`, and the addresses in
  # `outbox_mail`). Whatever bucket this names must be private and encrypted at rest, and its objects are
  # Restricted: treat a dump the way you would treat the database.
  archive:
    enabled: false
    # Daily, offset from the audit shipper's :17 so the two are not competing for the node's disk and uplink.
    schedule: "43 2 * * *"
    # s3://bucket[/prefix], or a directory for a demo. Keys are databases/{environment}/{database}-{stamp}.dump
    to: ""
    # Which venue these dumps belong to: prod, pr-4. Names part of the key.
    environment: ""
    region: eu-central-1
    # The dump is written here before it is uploaded, on the node's own disk — size it against the database, not
    # against the pod.
    scratchSize: 2Gi
    image:
      repository: ghcr.io/your-github-org/venue-dbarchive  # was: lordnacho
      tag: ""
      pullPolicy: IfNotPresent
      pullSecrets: []
  treasury:
    url: ""
    existingSecret: ""
    existingSecretKey: url
  identity:
    url: ""
    existingSecret: ""
    existingSecretKey: url
  parlays:
    url: ""
    existingSecret: ""
    existingSecretKey: url
  oracle:
    url: ""
    existingSecret: ""
    existingSecretKey: url

# Schema migrations (core/store/README.md): each service's `migrate`, run by one Job before the services need them
# (a Helm pre-install and pre-upgrade hook; in the release that creates an in-cluster PostgreSQL, a Job beside it,
# which the services wait for). Each migration run takes an advisory lock, so two runs never collide.
migrations:
  backoffLimit: 20
  # How long Atlas waits for another run's lock before giving up (its --lock-timeout).
  lockTimeout: 5m
  # A one-time bridge for a database migrated before Atlas was adopted (core/store/decisions.md, S-2). Such a schema
  # has tables Atlas has no history for, and it refuses the whole run: "connected database is not clean: found table
  # ... baseline version or allow-dirty is required". Naming the last migration that database already has tells Atlas
  # to record it as applied and carry on from the next one. Nothing is re-run and nothing is dropped.
  #
  #   baseline:
  #     identity: "20260917000001"
  #
  # Set it, upgrade once, then take it out again: on a schema Atlas already knows it does nothing, and left in place
  # it would quietly hide the same error on a database that is genuinely in the wrong state. A database this chart
  # created is never in this position, so this is empty by default (deploy/README.md, migrations).
  baseline: {}

# Interface 1. Flood limits per WebSocket session, and per account for REST: messages a second and burst, logons a
# minute per account (blueprint §12). Set well above what the page and bots need: a maker requoting every market can
# send a few dozen requests in one pass.
gateway:
  # The origins a browser page may call the API from, comma-separated (https://app.example.com), for a front end
  # served from somewhere other than this ingress — a development server, say. Empty allows only a page the venue
  # serves itself, which is what the demo page is.
  allowedOrigins: ""
  # The venues an app may point itself at, served as GET /v4/bootstrap (interfaces/gateway/README.md, choosing an
  # environment). Empty means the route is not offered at all and an app stays where it was built pointing.
  #
  # Exactly one entry should say `live: true`: the venue whose money is real. Everything else is a copy running a
  # branch, and an app says so where a person can see it. Only a member the records mark as staff is told about the
  # ones that are not live.
  #
  #   environments:
  #     - id: prod
  #       label: Live
  #       url: https://venue.example
  #       live: true
  #     - id: pr-7
  #       label: "PR 7: fees"
  #       url: https://pr-7.venue.example
  #       live: false
  environments: []
  perSecond: 200
  burst: 400
  logonsPerMinute: 30
  # The audit log of every request and answer (interfaces/audit), one file a day on a volume of its own. fsync stays
  # on as production has it; the demo's traffic is light.
  audit:
    fsync: true
    # Taking closed files to object storage and off this volume (interfaces/audit/README.md, interface 29). Without
    # it the volume grows until it is full, and a gateway that cannot write its audit log does not run — so on a
    # venue left running this is what keeps it up, not housekeeping.
    #
    # A CronJob of its own, not a sidecar on the gateway: ReadWriteOnce binds a volume to one node rather than one
    # pod, so a job scheduled onto the node the volume is affine to mounts it alongside the gateway. A sidecar that
    # cannot start makes the gateway's pod unready, and shipping log files is not worth that.
    archive:
      enabled: false
      # Where they go: `s3://bucket` or a path. The bucket is `deploy/aws` (`archive`), and its name is that
      # deployment's `archive` output.
      to: ""
      # Which venue these are from. It names a prefix, so one environment's records stay answerable separately
      # from another's; `metrics.env` is the same name the metrics carry.
      environment: ""
      # **Whether these are records somebody may have to produce.** False everywhere by default, and that is the
      # safe direction: true writes them under `audit/kept/`, where no lifecycle rule expires them, and locks them
      # immutable for `retainYears` — which nobody, the account's root user included, can undo. A demo's audit log
      # locked for five years is a bill that cannot be stopped.
      keepRecords: false
      retainYears: 5
      # Hourly, off the hour: a file is only shippable once it is closed, so this is how long a closed file waits,
      # not how much is kept. Which region the bucket is in — the CLI is given no credentials and no config file.
      schedule: "17 * * * *"
      region: eu-central-1
      image:
        repository: ghcr.io/your-github-org/venue-archive  # was: lordnacho
        tag: ""
        pullPolicy: IfNotPresent
        # What to pull it with, where that registry is not open. Its own, not the release-wide `image.pullSecrets`:
        # setting that puts a pull secret on every venue pod and rolls the release to turn archiving on. Falls back
        # to the release-wide list when empty.
        pullSecrets: []
    storage:
      size: 1Gi
      # Whether the audit volume outlives the release. True everywhere that matters, for the same reason as the
      # journal: an audit log is evidence. A preview sets it false, because its namespace is thrown away with its
      # pull request and these are a gigabyte a pod (deploy/argocd/preview.yaml).
      keepOnDelete: true
      # Empty uses the cluster's default class (k3d: local-path).
      className: ""
  # The public half (market data) and the private half (orders, accounts, transfers, requests for quote, keys) served
  # by separate gateway processes, each half a StatefulSet of its own with replicas, a Service each
  # (<release>-gateway-public, <release>-gateway-private) and an audit volume per pod (deploy/README.md, several
  # gateways). Off, one gateway serves both halves behind <release>-gateway. Flood and logon limits are per pod, so an
  # account may reach replicas times them.
  split:
    enabled: false
    # Each half scales on its own: helm upgrade --reuse-values --set gateway.split.public.replicas=N (or private).
    # A pod scaled away leaves its audit volume, and its last file unsealed, until a pod of its name returns
    # (deploy/README.md, several gateways).
    public:
      replicas: 2
    private:
      replicas: 2
  # Seconds a stopping gateway pod keeps serving after it has been taken out of its Service's endpoints, so the
  # ingress and kube-proxy stop sending it new connections before its sessions are closed.
  drainSeconds: 5

# One host name for the page and the gateway, routed by path (deploy/README.md, one host name): /v4/ws_public and
# /v4/markets with everything under it to the public half, the rest of /v4 to the private half (or both to the one
# gateway when the halves are not split), and everything else to the web page. WebSockets pass through as they are.
ingress:
  enabled: false
  # k3s and k3d ship Traefik, whose IngressClass is traefik.
  className: traefik
  # Empty answers any host name.
  host: ""
  annotations: {}
  # A certificate for the host above, as a Secret of type kubernetes.io/tls already in the namespace: the venue is then
  # served over https and wss. Phones need it — iOS refuses cleartext by default, and Android has since 9 — so a demo
  # that is to be opened from a phone or a simulator wants one, self-signed and trusted on the device for a test
  # (deploy/README.md, from a phone). Empty serves plain http, which is what a laptop browser is happy with.
  tls:
    secretName: ""
  # /oracle and /treasury, the dummy oracle's control API and the treasury's reconciliation summary, reach the page's
  # server and through it those services, as they do under deploy/laptop.sh web. They are unauthenticated operator
  # APIs: true only for a demo on a private network; false routes only the page itself (/ and /api), so they are not
  # served, and the page's settlement tab and reconciliation section stop working.
  operatorApis: true
  # Addresses and networks, comma-separated, of the proxies in front of the gateway whose X-Forwarded-For the gateway
  # believes for its audit log's client field (interfaces/audit/README.md, the client behind a proxy): the ingress
  # controller's pods, here the cluster's pod network, 10.42.0.0/16 by default in k3s and k3d (a cluster created with
  # another --cluster-cidr needs its own). It trusts every pod in that network to say whom it forwards for, which only
  # changes what audit records say. Set only while the ingress is enabled; empty trusts nothing.
  trustedProxies: 10.42.0.0/16

# The FIX 4.4 adapter (adapters/fix, interface 4) in front of the gateway's private half: a StatefulSet of one, since
# Artio's session state is one writer's, with its data (sequence numbers and the message archive) and its audit log
# on volumes of their own. The archive holds every Logon's Password (554), API key secrets included, in clear: the
# adapter creates everything private to its user, no other pod mounts the volumes, and they belong on encrypted
# storage wherever real keys are used. Built as the image venue-fix (deploy/images/venue-fix.Dockerfile).
fix:
  enabled: false
  image:
    repository: venue-fix
    # Empty: image.tag.
    tag: ""
  # The venue's CompID; clients send it as TargetCompID (56).
  compId: VENUE
  cancelOnDisconnect: true
  # SenderCompIDs, comma-separated, whose orders outlive their sessions.
  keepOrdersFor: ""
  auditFsync: true
  service:
    # LoadBalancer publishes the port on the cluster's nodes (k3s ServiceLB), which k3d's load balancer can map to a
    # host address (deploy/README.md); ClusterIP keeps FIX inside the cluster.
    type: LoadBalancer
    port: 9879
  storage:
    data: 1Gi
    audit: 1Gi
    # Empty uses the cluster's default class (k3d: local-path).
    className: ""
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 1Gi

# The parlay service: parlays listed on request, requests for quote routed to approved responders that subscribe, and
# settlement from the legs. Responders start from the catalogue's "responder": true accounts and are approved and
# revoked through its operator API on port 7104, kept in its PostgreSQL database (database.parlays). A request accepts quotes for
# windowSeconds of sequencer time, and is for at least minQuantity contracts (a multiple of the lot step, 10). Every
# book reserves its levels until the engine releases it, half an hour after it settles, so the venue carries at most
# maxParlays at once: a parlay's ladder has 279 rows, 558 levels, of the small profile's 131 072. It also holds, like
# the oracle, while one more parlay would take the core past 95% of core.capacity, which the oracle's rounds share.
parlays:
  enabled: true
  windowSeconds: 30
  maxParlays: 100
  minQuantity: 10

# Synthetic traders, clients of the gateway. Each acts as the catalogue account its dev token names. The maker holds a
# WebSocket session with cancel-on-disconnect, so replacing its pod pulls its quotes; the taker uses REST.
bots:
  maker:
    enabled: true
    token: dev-synthetic-maker
    # Contracts quoted at the touch on each side, in lots; level k further out quotes (k + 1) times this.
    size: 10
    # Price levels quoted on each side.
    levels: 3
    # Ticks from fair value to each quote.
    spread: 1
    intervalMs: 700
    seed: 1
    # As an approved responder, what it adds to a parlay's price from its legs' books, in thousandths.
    margin: 100
  taker:
    enabled: true
    token: dev-synthetic-taker
    maxQuantity: 5
    # Chance per market per interval of an order, and of that order being a sweep, in thousandths.
    chance: 250
    sweepChance: 30
    intervalMs: 1000
    seed: 2

# Metrics and logs (deploy/observability/). Each process serves Prometheus metrics on a port of its own, never a client
# port: core 9101, gateway 9102, observer 9103, FIX adapter 9104; and logs one line per event to stdout, as JSON with
# logFormat json or readable text with text. Scraping and dashboards are the observability stack's
# (deploy/observability/install.sh), in its own namespace.
metrics:
  enabled: true
  # Labels on every series this release exports, added by the PodMonitor: the environment's name, and its profile.
  # A laptop or per-PR environment is functional, which the latency dashboard refuses to plot (blueprint §16).
  env: local
  profile: functional
  # The namespace Prometheus scrapes from, let in to the metrics ports of the pods that have network policies.
  monitoringNamespace: monitoring
  # A PodMonitor for the Prometheus Operator, rendered only where its API exists.
  podMonitor:
    enabled: true
    interval: 15s
  logFormat: json

# The observer (core/observer): journal-derived metrics and read-only operator endpoints from the core's feed. With
# metrics.enabled only.
observer:
  enabled: true
  # Markets with series of their own at once; more are counted only in the venue's totals.
  maxMarketSeries: 500
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 256Mi

fullnameOverride: ""
