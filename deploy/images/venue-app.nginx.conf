# Serving the exported retail app. Static files and nothing else: this server never talks to the venue, and the
# browser calls the venue's own origin directly (which is why the gateway has an allow-list, decision G-15).

server {
    # Above 1024, so nginx needs no privileges to bind it.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Expo Router exports a file per route, and a link shared into the middle of the app must still work. So a
    # request is tried as a file, then as `<path>.html` — which is what the export actually writes — then as a
    # directory, and only then falls back to the entry point for the router to sort out on the client.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # The bundles carry a content hash in their names, so they may be cached for as long as anyone likes. The HTML
    # must not be: it is what names the current bundle, and a cached copy is how somebody ends up running last
    # week's app against this week's venue.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Nothing here is served in a frame, and nothing here should guess a content type: both are cheap to say and
    # awkward to add after something has gone wrong.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # For the chart's probes, so readiness does not depend on the app's own entry point parsing.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
