#cloud-config
# What a bare Ubuntu instance needs to become the node the previews run on. Runs once, on first boot; a stop and a
# later start do not run it again, which is why nothing here is written as if it might.
package_update: true
packages:
  - curl
  - ca-certificates

write_files:
  # k3s forwards cluster DNS to the host's /etc/resolv.conf. On Ubuntu that names 127.0.0.53, systemd-resolved's
  # stub, which from inside a pod is the pod's own loopback — so nothing external resolves anywhere in the cluster
  # and it looks like a firewall rather than DNS. This cost an hour on the laptop cluster (deploy/README.md); here
  # it is simply never allowed to happen.
  - path: /var/lib/rancher/k3s/server/manifests/coredns-custom.yaml
    permissions: "0600"
    content: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: coredns-custom
        namespace: kube-system
      data:
        external.override: |
          forward . 169.254.169.253 1.1.1.1 {
            policy sequential
          }

runcmd:
  # Traefik comes with k3s and is what the chart's Ingress objects expect, so it stays. ServiceLB likewise: it is
  # what puts :80 and :443 on the host without a cloud load balancer, and an ALB would be $16 a month to do the
  # same for one node.
  # --tls-san: the API certificate has to cover the address and the name this box is reached by, or every kubectl
  # from anywhere but the box itself fails to verify it. k3s will not reissue a certificate just because the list
  # changed later, so getting it right at install is the difference between working and a repair.
  - |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644 --tls-san ${public_ip} --tls-san ${domain}" sh -
  # The kubeconfig is fetched and rewritten by `venue.sh kubeconfig`, from the machine that already knows this
  # box's address. Doing it here would mean asking the metadata service, which on this AMI needs a token first
  # (IMDSv2) — and a version of that which forgets the token writes nothing and says nothing, which is how this was
  # found.
  - until [ -f /etc/rancher/k3s/k3s.yaml ]; do sleep 2; done
  - touch /var/lib/venue-ready
