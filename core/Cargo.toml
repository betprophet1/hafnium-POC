[workspace]
resolver = "2"
members = ["engine", "gateway", "harness", "identity", "journal", "link", "node", "parlays", "sim", "telemetry", "treasury", "prototypes/l3book", "prototypes/maskbench"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
publish = false
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
float_cmp = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"

# Overflow is a fail-stop (spec E-2.2), never a wrap, in every profile. The engine should also use checked
# arithmetic on money and quantities so a fail-stop is reported rather than a panic.
[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
debug = 1

# Latency-oriented build for benchmarks and performance runs: whole-program optimisation, one codegen unit, no
# unwinding, symbols kept for profilers, overflow checks still on. Always name the target CPU, never `native`
# (blueprint §4), and keep it in its own target directory so the ordinary build cache survives:
#   RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --profile perf --target-dir target/perf-v3
[profile.perf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
