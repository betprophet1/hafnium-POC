[package]
name = "venue-link"
version = "0.1.0"
description = "Talking to a node from outside the engine: ingress, feed, a projection of the feed, and the demo catalogue"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Both halves of a snapshot: the engine's, and the one a reader is restored from (src/pair.rs).
[[bin]]
name = "venue-view"
path = "src/main.rs"

[dependencies]
venue-engine = { path = "../engine" }
venue-harness = { path = "../harness" }
venue-node = { path = "../node" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
