[package]
name = "venue-gateway"
version = "0.1.0"
description = "Interface 1: the REST and WebSocket gateway in front of a sequencer group"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
venue-link = { path = "../link" }
# The generated SBE decoders, to read a feed result without inflating it into JSON (`hub.rs`, ADR-0002).
venue_journal = { path = "../journal" }
# What a key's credential and permissions look like, read the same way the identity service reads them.
venue-identity = { path = "../identity" }
serde_json = "1"
# The audit log's hash chain (interfaces/audit/README.md).
sha2 = "0.11"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# epoll for the WebSocket event loops (reactor.rs): the OS poller and TCP types, no runtime and no logging.
mio = { version = "1", default-features = false, features = ["os-poll", "net"] }
# Metrics and structured logs (deploy/observability/metrics.md).
venue-telemetry = { path = "../telemetry" }
# Pinning a reactor thread to one core (affinity.rs): a safe wrapper over sched_setaffinity, since the
# workspace forbids unsafe code even outside core/engine.
core_affinity = "0.8"
mimalloc = "0.1.52"

[dev-dependencies]
# The request-path tests run order entry against a real node rather than a stub of one.
venue-node = { path = "../node" }
# And deposits and withdrawals against a real treasury, in PostgreSQL when a test database is given.
venue-treasury = { path = "../treasury" }
venue-store = { path = "../store" }
# Requests for quote are tested against the parlay service itself, beside the node.
venue-parlays = { path = "../parlays" }
