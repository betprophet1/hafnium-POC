[package]
name = "venue-harness"
version = "0.1.0"
description = "Runs compiled engine scenarios and differential vectors against the Rust engine"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
venue-engine = { path = "../engine" }
venue_journal = { path = "../journal" }
serde_json = "1"

[features]
# Holds the engine's read-only fill check to the logged dry run on every vector (venue-engine/dry-run-oracle).
oracle = ["venue-engine/dry-run-oracle"]

[[bin]]
name = "run-scenarios"
path = "src/bin/run_scenarios.rs"
