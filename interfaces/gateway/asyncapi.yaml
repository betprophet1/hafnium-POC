asyncapi: 3.0.0
info:
  title: Venue WebSocket API
  version: 4.0.0-draft.1
  description: |
    Interface 1, the WebSocket half of the REST and WebSocket gateway (blueprint §13). There are two endpoints, and
    one connection is one session on one of them:

    - `/v4/ws_public` carries public market data. It needs no login: a session subscribes to topics and receives
      conflated books, trades and market states.
    - `/v4/ws_private` carries one account. A session logs in with a token, enters and cancels orders, requests
      quotes for parlays, and receives that account's executions, account updates, payouts, releases and transfer
      updates, the quotes on its requests and, for a registered responder, other accounts' requests. It carries no
      public topics.

    A client that trades and watches the market opens one of each. The two may be served by one gateway or by
    separate ones (README, public and private); a client addresses them only by path. This document describes the
    gateway: `receive` operations are messages clients send, `send` operations are messages the gateway sends.

    Every message is a JSON text frame. A client may add an `id` to any request; the gateway echoes it on the reply
    or error. Order bodies, results and executions are the schemas of `openapi.yaml`. Semantics are in `README.md`.
servers:
  laptop:
    host: 127.0.0.1:8080
    protocol: ws
    description: The mini venue on a laptop, after `deploy/laptop.sh web`
channels:
  public:
    address: /v4/ws_public
    description: Public market data. No login.
    messages:
      subscribe: { $ref: '#/components/messages/subscribe' }
      unsubscribe: { $ref: '#/components/messages/unsubscribe' }
      heartbeat: { $ref: '#/components/messages/heartbeat' }
      reply: { $ref: '#/components/messages/reply' }
      error: { $ref: '#/components/messages/error' }
      book: { $ref: '#/components/messages/book' }
      trade: { $ref: '#/components/messages/trade' }
      market: { $ref: '#/components/messages/market' }
  private:
    address: /v4/ws_private
    description: One account's orders and everything that happens to them. Log in first.
    messages:
      login: { $ref: '#/components/messages/login' }
      order: { $ref: '#/components/messages/order' }
      amend: { $ref: '#/components/messages/amend' }
      cancel: { $ref: '#/components/messages/cancel' }
      cancelAll: { $ref: '#/components/messages/cancelAll' }
      requestQuote: { $ref: '#/components/messages/requestQuote' }
      attachQuote: { $ref: '#/components/messages/attachQuote' }
      heartbeat: { $ref: '#/components/messages/heartbeat' }
      welcome: { $ref: '#/components/messages/welcome' }
      reply: { $ref: '#/components/messages/reply' }
      error: { $ref: '#/components/messages/error' }
      execution: { $ref: '#/components/messages/execution' }
      account: { $ref: '#/components/messages/account' }
      payout: { $ref: '#/components/messages/payout' }
      release: { $ref: '#/components/messages/release' }
      transfer: { $ref: '#/components/messages/transfer' }
      resync: { $ref: '#/components/messages/resync' }
      rfq: { $ref: '#/components/messages/rfq' }
      quote: { $ref: '#/components/messages/quote' }
operations:
  receiveLogin:
    action: receive
    channel: { $ref: '#/channels/private' }
    summary: Authenticate the session. Required before anything else on this endpoint.
    messages: [{ $ref: '#/channels/private/messages/login' }]
    reply:
      channel: { $ref: '#/channels/private' }
      messages: [{ $ref: '#/channels/private/messages/welcome' }, { $ref: '#/channels/private/messages/error' }]
  receiveSubscribe:
    action: receive
    channel: { $ref: '#/channels/public' }
    summary: >
      Subscribe to public topics. Each book topic answers at once with every level, flagged snapshot, and sends
      only what changes after that.
    messages: [{ $ref: '#/channels/public/messages/subscribe' }]
  receiveUnsubscribe:
    action: receive
    channel: { $ref: '#/channels/public' }
    messages: [{ $ref: '#/channels/public/messages/unsubscribe' }]
  receiveOrder:
    action: receive
    channel: { $ref: '#/channels/private' }
    summary: Place an order; the reply follows once the input is committed.
    messages: [{ $ref: '#/channels/private/messages/order' }]
    reply:
      channel: { $ref: '#/channels/private' }
      messages: [{ $ref: '#/channels/private/messages/reply' }, { $ref: '#/channels/private/messages/error' }]
  receiveAmend:
    action: receive
    channel: { $ref: '#/channels/private' }
    messages: [{ $ref: '#/channels/private/messages/amend' }]
    reply:
      channel: { $ref: '#/channels/private' }
      messages: [{ $ref: '#/channels/private/messages/reply' }, { $ref: '#/channels/private/messages/error' }]
  receiveCancel:
    action: receive
    channel: { $ref: '#/channels/private' }
    messages: [{ $ref: '#/channels/private/messages/cancel' }]
    reply:
      channel: { $ref: '#/channels/private' }
      messages: [{ $ref: '#/channels/private/messages/reply' }, { $ref: '#/channels/private/messages/error' }]
  receiveCancelAll:
    action: receive
    channel: { $ref: '#/channels/private' }
    messages: [{ $ref: '#/channels/private/messages/cancelAll' }]
    reply:
      channel: { $ref: '#/channels/private' }
      messages: [{ $ref: '#/channels/private/messages/reply' }, { $ref: '#/channels/private/messages/error' }]
  receiveRequestQuote:
    action: receive
    channel: { $ref: '#/channels/private' }
    summary: >-
      Request quotes for a parlay (README, parlays). The reply names the request and the parlay, listed first if it
      did not exist; quotes follow as `quote` messages.
    messages: [{ $ref: '#/channels/private/messages/requestQuote' }]
    reply:
      channel: { $ref: '#/channels/private' }
      messages: [{ $ref: '#/channels/private/messages/reply' }, { $ref: '#/channels/private/messages/error' }]
  receiveAttachQuote:
    action: receive
    channel: { $ref: '#/channels/private' }
    summary: >-
      A registered responder attaches one of its resting sells on the request's parlay to the request, as a quote.
    messages: [{ $ref: '#/channels/private/messages/attachQuote' }]
    reply:
      channel: { $ref: '#/channels/private' }
      messages: [{ $ref: '#/channels/private/messages/reply' }, { $ref: '#/channels/private/messages/error' }]
  receivePublicHeartbeat:
    action: receive
    channel: { $ref: '#/channels/public' }
    summary: >-
      A heartbeat carrying an `id` is answered with an empty reply, so a client can tell a gateway that has
      gone from a quiet market.
    messages: [{ $ref: '#/channels/public/messages/heartbeat' }]
    reply:
      channel: { $ref: '#/channels/public' }
      messages: [{ $ref: '#/channels/public/messages/reply' }]
  receivePrivateHeartbeat:
    action: receive
    channel: { $ref: '#/channels/private' }
    summary: >-
      Keep a session with `heartbeatSeconds` alive; any other client message counts too. A heartbeat carrying an `id`
      is answered with an empty reply, so a client can tell a gateway that has gone from a quiet market.
    messages: [{ $ref: '#/channels/private/messages/heartbeat' }]
    reply:
      channel: { $ref: '#/channels/private' }
      messages: [{ $ref: '#/channels/private/messages/reply' }]
  sendBook:
    action: send
    channel: { $ref: '#/channels/public' }
    summary: 'Topic book.{instrumentId}: a full snapshot to the requested depth, at most ten a second per topic.'
    messages: [{ $ref: '#/channels/public/messages/book' }]
  sendTrade:
    action: send
    channel: { $ref: '#/channels/public' }
    summary: 'Topic trades.{instrumentId}: every trade, anonymous.'
    messages: [{ $ref: '#/channels/public/messages/trade' }]
  sendMarket:
    action: send
    channel: { $ref: '#/channels/public' }
    summary: 'Topic markets: market states, event phases and event resolutions as they change.'
    messages: [{ $ref: '#/channels/public/messages/market' }]
  sendExecution:
    action: send
    channel: { $ref: '#/channels/private' }
    summary: After login, every execution on the account's orders, from any session.
    messages: [{ $ref: '#/channels/private/messages/execution' }]
  sendAccount:
    action: send
    channel: { $ref: '#/channels/private' }
    summary: After login, the sleeve and changed positions whenever an input changes them.
    messages: [{ $ref: '#/channels/private/messages/account' }]
  sendPayout:
    action: send
    channel: { $ref: '#/channels/private' }
    summary: After login, settlement payouts to the account.
    messages: [{ $ref: '#/channels/private/messages/payout' }]
  sendRelease:
    action: send
    channel: { $ref: '#/channels/private' }
    summary: After login, complete sets of the account's contracts returned as cash after a fill.
    messages: [{ $ref: '#/channels/private/messages/release' }]
  sendTransfer:
    action: send
    channel: { $ref: '#/channels/private' }
    summary: >-
      After login, each change of state of the account's deposits and withdrawals, from any session or REST call.
      Only to sessions whose credential holds the transfers permission.
    messages: [{ $ref: '#/channels/private/messages/transfer' }]
  sendRfq:
    action: send
    channel: { $ref: '#/channels/private' }
    summary: >-
      To registered responders logged in, each request for quote from another account as it opens. The requester is
      not named.
    messages: [{ $ref: '#/channels/private/messages/rfq' }]
  sendQuote:
    action: send
    channel: { $ref: '#/channels/private' }
    summary: >-
      To the requester, each quote on its requests: when it is attached, when a fill reduces it, and when it leaves
      the book. The responder is not named.
    messages: [{ $ref: '#/channels/private/messages/quote' }]
  sendResync:
    action: send
    channel: { $ref: '#/channels/private' }
    summary: The gateway cannot resume from the requested sequence; fetch GET /v4/account and continue from `sequence`.
    messages: [{ $ref: '#/channels/private/messages/resync' }]
components:
  schemas:
    RequestId:
      type: string
      maxLength: 64
      description: Chosen by the client and echoed on the reply or error.
    Topic:
      type: string
      pattern: '^(markets|book\.[0-9]{1,20}|trades\.[0-9]{1,20})$'
    OrderResult: { $ref: './openapi.yaml#/components/schemas/OrderResult' }
    CancelAllResult: { $ref: './openapi.yaml#/components/schemas/CancelAllResult' }
    Transfer: { $ref: './openapi.yaml#/components/schemas/Transfer' }
    Rfq: { $ref: './openapi.yaml#/components/schemas/Rfq' }
    Quote: { $ref: './openapi.yaml#/components/schemas/Quote' }
  messages:
    login:
      payload:
        type: object
        required: [op, token]
        additionalProperties: false
        properties:
          op: { const: login }
          id: { $ref: '#/components/schemas/RequestId' }
          token: { type: string, description: The account's dev token in test environments. }
          cancelOnDisconnect:
            type: boolean
            default: false
            description: When the session ends, its resting orders are cancelled (reason session_disconnect).
          heartbeatSeconds:
            type: integer
            minimum: 0
            maximum: 300
            default: 0
            description: If positive, a session silent this long has its orders cancelled (heartbeat_missed) and is closed.
          resumeFrom:
            $ref: './openapi.yaml#/components/schemas/Id'
            description: Replay the account's executions, account updates and payouts after this sequence.
          stream:
            type: boolean
            default: true
            deprecated: true
            description: Accepted and has no effect; every session is streamed to as things happen (README).
    subscribe:
      payload:
        type: object
        required: [op, topics]
        additionalProperties: false
        properties:
          op: { const: subscribe }
          id: { $ref: '#/components/schemas/RequestId' }
          topics: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Topic' } }
          depth: { type: integer, minimum: 1, maximum: 100, default: 20 }
    unsubscribe:
      payload:
        type: object
        required: [op, topics]
        additionalProperties: false
        properties:
          op: { const: unsubscribe }
          id: { $ref: '#/components/schemas/RequestId' }
          topics: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Topic' } }
    order:
      payload:
        allOf:
          - type: object
            required: [op]
            properties:
              op: { const: order }
              id: { $ref: '#/components/schemas/RequestId' }
          - $ref: './openapi.yaml#/components/schemas/OrderRequest'
    amend:
      payload:
        allOf:
          - type: object
            required: [op, orderId]
            properties:
              op: { const: amend }
              id: { $ref: '#/components/schemas/RequestId' }
              orderId: { $ref: './openapi.yaml#/components/schemas/Id' }
          - $ref: './openapi.yaml#/components/schemas/AmendRequest'
    cancel:
      payload:
        type: object
        required: [op, orderId]
        additionalProperties: false
        properties:
          op: { const: cancel }
          id: { $ref: '#/components/schemas/RequestId' }
          orderId: { $ref: './openapi.yaml#/components/schemas/Id' }
    cancelAll:
      payload:
        type: object
        required: [op]
        additionalProperties: false
        properties:
          op: { const: cancelAll }
          id: { $ref: '#/components/schemas/RequestId' }
          instrumentId: { $ref: './openapi.yaml#/components/schemas/Id' }
          eventId: { $ref: './openapi.yaml#/components/schemas/Id' }
    requestQuote:
      payload:
        allOf:
          - type: object
            required: [op]
            properties:
              op: { const: requestQuote }
              id: { $ref: '#/components/schemas/RequestId' }
          - $ref: './openapi.yaml#/components/schemas/RfqRequest'
    attachQuote:
      payload:
        allOf:
          - type: object
            required: [op, requestId]
            properties:
              op: { const: attachQuote }
              id: { $ref: '#/components/schemas/RequestId' }
              requestId: { $ref: './openapi.yaml#/components/schemas/RfqId' }
          - $ref: './openapi.yaml#/components/schemas/QuoteAttach'
    heartbeat:
      payload:
        type: object
        required: [op]
        additionalProperties: false
        properties:
          op: { const: heartbeat }
          id:
            allOf: [{ $ref: '#/components/schemas/RequestId' }]
            description: If present, the gateway answers with a reply carrying this id and an empty result.
    welcome:
      payload:
        type: object
        required: [type, accountId, sessionId, sequence, resumed]
        properties:
          type: { const: welcome }
          id: { $ref: '#/components/schemas/RequestId' }
          accountId: { $ref: './openapi.yaml#/components/schemas/Id' }
          sessionId: { $ref: './openapi.yaml#/components/schemas/Id' }
          sequence: { $ref: './openapi.yaml#/components/schemas/Id' }
          resumed: { type: boolean, description: True when every message after `resumeFrom` follows. }
    reply:
      payload:
        type: object
        required: [type, result]
        properties:
          type: { const: reply }
          id: { $ref: '#/components/schemas/RequestId' }
          result:
            oneOf:
              - $ref: '#/components/schemas/OrderResult'
              - $ref: '#/components/schemas/CancelAllResult'
              - $ref: '#/components/schemas/Rfq'
              - $ref: '#/components/schemas/Quote'
    error:
      payload:
        type: object
        required: [type, error]
        properties:
          type: { const: error }
          id: { $ref: '#/components/schemas/RequestId' }
          error: { $ref: './openapi.yaml#/components/schemas/Error/properties/error' }
    book:
      description: >
        Levels of one book. The first message after subscribing carries every level, with snapshot true, so a
        client starts from it; every message after it carries only the levels that have moved since. A quantity of
        zero means that level has gone. A client that would rather resynchronise another way can take a whole book
        from GET /v4/markets/{instrumentId}/book, which still answers with one.
      payload:
        type: object
        required: [type, instrumentId, sequence, changes]
        properties:
          type: { const: book }
          instrumentId: { $ref: './openapi.yaml#/components/schemas/Id' }
          sequence: { $ref: './openapi.yaml#/components/schemas/Id' }
          state: { type: string, description: The market's state, as in REST. }
          snapshot:
            type: boolean
            description: Every level of the book, to be started from, rather than only what has changed.
          last:
            $ref: './openapi.yaml#/components/schemas/PriceQuote'
            description: Where it last traded, if it has.
          changes:
            type: array
            items:
              type: object
              required: [side, price, quantity, orders]
              properties:
                side: { $ref: './openapi.yaml#/components/schemas/Side' }
                price: { $ref: './openapi.yaml#/components/schemas/PriceQuote' }
                quantity: { type: integer, description: Zero means this level has gone. }
                orders: { type: integer }
    trade:
      payload:
        type: object
        required: [type, sequence, instrumentId, price, quantity, takerSide]
        properties:
          type: { const: trade }
          sequence: { $ref: './openapi.yaml#/components/schemas/Id' }
          instrumentId: { $ref: './openapi.yaml#/components/schemas/Id' }
          tradeId: { $ref: './openapi.yaml#/components/schemas/Id' }
          price: { $ref: './openapi.yaml#/components/schemas/PriceQuote' }
          quantity: { type: integer }
          takerSide: { $ref: './openapi.yaml#/components/schemas/Side' }
          at: { type: string, format: date-time, description: The sequencer's time. }
    market:
      payload:
        type: object
        required: [type, sequence, eventId]
        properties:
          type: { const: market }
          sequence: { $ref: './openapi.yaml#/components/schemas/Id' }
          eventId: { $ref: './openapi.yaml#/components/schemas/Id' }
          instrumentId: { $ref: './openapi.yaml#/components/schemas/Id' }
          state: { $ref: './openapi.yaml#/components/schemas/MarketState' }
          phase: { type: string, enum: [started, suspended, resumed, ended], description: Set for an event phase change. }
          resolution:
            $ref: './openapi.yaml#/components/schemas/Resolution'
            description: >
              Set once an event is resolved or voided, after each of its markets' own state change: the markets
              show only that trading ended, and this says which, and which outcome occurred.
          released:
            type: boolean
            const: true
            description: >
              Set when the venue releases a settled event, a retention after its resolution (spec E-8.4): the event
              and its markets are gone from GET /v4/markets and their books, and their IDs name nothing.
    execution:
      payload:
        allOf:
          - type: object
            required: [type, execution]
            properties:
              type: { const: execution }
              execution: { $ref: './openapi.yaml#/components/schemas/Execution' }
    account:
      payload:
        type: object
        required: [type, sequence, availableCents, reservedCents, positions]
        properties:
          type: { const: account }
          sequence: { $ref: './openapi.yaml#/components/schemas/Id' }
          availableCents: { type: integer }
          reservedCents: { type: integer }
          positions:
            type: array
            description: Only positions this input changed, including those now zero.
            items: { $ref: './openapi.yaml#/components/schemas/Position' }
    payout:
      summary: >-
        A resolved event pays each position its value in the winning state, one message per market. A void reverses
        every trade in the event (spec E-15.4): one message per account, with instrumentId "0" and positionClosed 0,
        whose cents return what the account put in and take back what it took out, so they can be negative and can
        leave available cash below zero.
      payload:
        type: object
        required: [type, sequence, eventId, instrumentId, kind, positionClosed, cents]
        properties:
          type: { const: payout }
          sequence: { $ref: './openapi.yaml#/components/schemas/Id' }
          eventId: { $ref: './openapi.yaml#/components/schemas/Id' }
          instrumentId:
            allOf: [{ $ref: './openapi.yaml#/components/schemas/Id' }]
            description: The market for a resolved payout; "0" for a void, which pays per account across the event.
          kind: { type: string, enum: [resolved, void] }
          positionClosed: { type: integer, description: 0 for a void; positions close through the account message. }
          cents: { type: integer, description: Negative when a void takes back more than it returns. }
    release:
      summary: >-
        After a fill, complete sets the account holds and has not offered for sale are returned as cash (spec
        E-14.3): one YES on every outcome of an event pays $1.00 in any outcome, one NO on every outcome of an
        N-outcome event pays $(N − 1). The matching positions fall in the account message of the same sequence.
      payload:
        type: object
        required: [type, sequence, eventId, kind, cents]
        properties:
          type: { const: release }
          sequence: { $ref: './openapi.yaml#/components/schemas/Id' }
          eventId: { $ref: './openapi.yaml#/components/schemas/Id' }
          kind: { type: string, enum: [yes_set_burn, no_set_burn] }
          cents: { type: integer, minimum: 1 }
    transfer:
      summary: >-
        A deposit or withdrawal of the account was created or changed state, reason or sequence. It comes from the
        treasury rather than the journal, so it carries no sequence of its own and is not replayed by `resumeFrom`: a
        client that reconnects fetches GET /v4/transfers. A transfer's `sequence` names the input whose `account`
        message carries the balance it moved.
      payload:
        type: object
        required: [type, transfer]
        properties:
          type: { const: transfer }
          transfer: { $ref: '#/components/schemas/Transfer' }
    rfq:
      summary: A request for quote, as a responder sees it. Quote by resting a sell of YES and attaching it.
      payload:
        allOf:
          - type: object
            required: [type]
            properties:
              type: { const: rfq }
          - $ref: '#/components/schemas/Rfq'
    quote:
      summary: A quote on one of this account's requests, as it is attached, reduced and leaves the book.
      payload:
        allOf:
          - type: object
            required: [type]
            properties:
              type: { const: quote }
          - $ref: '#/components/schemas/Quote'
    resync:
      payload:
        type: object
        required: [type, sequence]
        properties:
          type: { const: resync }
          sequence: { $ref: './openapi.yaml#/components/schemas/Id' }
