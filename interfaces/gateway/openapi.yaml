openapi: 3.1.0
info:
  title: Venue REST API
  version: 4.0.0-draft.1
  summary: Interface 1, the REST half of the REST and WebSocket gateway (blueprint §13).
  description: |
    Orders and account calls in the venue's own terms. The gateway authenticates and validates every request
    completely, converts prices and stakes to the journal's tick ordinals and contract counts (blueprint §6), and
    submits one canonical message to the sequencer group (interface 7). It answers only once the input is committed
    and its outcome exists (spec E-17.4).

    Two kinds of refusal, never mixed:
    - An HTTP 4xx or 503 `Error` is the gateway refusing at the edge. Nothing was journaled.
    - An HTTP 200 `OrderResult` whose `status` is `rejected` is the engine's sequenced decision, replayable from the
      journal.

    The WebSocket half is `asyncapi.yaml`. Semantics shared by both are in `README.md` beside this file.

    The `markets` paths are the public half and the `account`, `transfers` and `rfq` paths the private half (README,
    public and private): they may be served by one gateway or by separate ones behind the same host.

    Transfers move money in and out of the account through the treasury, never through the sequencer group directly
    (README, deposits and withdrawals). Moving money is a permission of its own, `transfers`: an API key holds it only
    when it was created with it (README, API keys and permissions). Each operation's security requirement names the
    permission an API key needs for it; a dev token, in test environments, holds every permission.

    Answering requests for quote needs two things: the account must be one the parlay service's operator has approved
    as a responder (README, parlays), and the credential must hold the permission named `respond` in the security
    requirement of the responder operations. A dev token holds `respond`; an API key holds it only when it was created
    with it. Either one missing is 403 `FORBIDDEN`.
servers:
  - url: http://127.0.0.1:8080
    description: The mini venue on a laptop, after `deploy/laptop.sh web`
security:
  - apiKey: [read]
  - devToken: []
tags:
  - name: markets
    description: Public reference data and books. The public half; no login.
  - name: account
    description: The authenticated account's orders, positions and sleeve. The private half.
  - name: transfers
    description: Deposits and withdrawals through the treasury. The private half, and a permission of its own.
  - name: rfq
    description: Requests for quote on parlays, and quotes attached to them (README, parlays). The private half.
  - name: keys
    description: The account's API keys (README, API keys and permissions). The private half.
paths:
  /v4/markets:
    get:
      operationId: listMarkets
      tags: [markets]
      summary: Events, their markets and price ladders
      security: []
      parameters:
        - name: resolved
          in: query
          description: |
            Only events that are (`true`) or are not (`false`) resolved. A settled event stays listed until the venue
            releases it, a retention after its resolution (spec E-8.4), so a client that trades asks for `false`.
            Omitted, every event the venue still carries.
          schema: { type: boolean }
      responses:
        '200':
          description: Every event the gateway knows, or those `resolved` selects, with its markets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Markets' }
  /v4/markets/{instrumentId}/book:
    get:
      operationId: getBook
      tags: [markets]
      summary: A snapshot of one book, in YES terms
      security: []
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - name: depth
          in: query
          description: Price levels per side.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: The book at `sequence`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v4/account:
    get:
      operationId: getAccount
      security:
        - apiKey: [read]
        - devToken: []
      tags: [account]
      summary: The account's sleeve, positions and resting orders
      responses:
        '200':
          description: The account at `sequence`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v4/orders:
    post:
      operationId: placeOrder
      security:
        - apiKey: [trade]
        - devToken: []
      tags: [account]
      summary: Place an order
      description: |
        Idempotent on `clientOrderId` for two hours (spec E-9.2): resending returns `status: duplicate`
        with the original order ID. After a 503 the outcome is unknown; resend with the same `clientOrderId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderRequest' }
      responses:
        '200':
          description: The sequenced outcome and every execution the input caused for this account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: cancelAllOrders
      security:
        - apiKey: [trade]
        - devToken: []
      tags: [account]
      summary: Cancel every resting order of the account, or those in one market or event
      parameters:
        - name: instrumentId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: eventId
          in: query
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: The cancellations, in ascending order ID. Empty when nothing was in scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelAllResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v4/orders/{orderId}:
    patch:
      operationId: amendOrder
      security:
        - apiKey: [trade]
        - devToken: []
      tags: [account]
      summary: Change a resting order's price, quantity or event-start behaviour
      description: A reduction at the same price keeps priority; anything else loses it and may trade (spec E-12.4, E-12.5).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AmendRequest' }
      responses:
        '200':
          description: The sequenced outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      operationId: cancelOrder
      security:
        - apiKey: [trade]
        - devToken: []
      tags: [account]
      summary: Cancel a resting order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The sequenced outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v4/transfers:
    post:
      operationId: requestTransfer
      security:
        - apiKey: [transfers]
        - devToken: []
      tags: [transfers]
      summary: Deposit money into the account, or withdraw it
      description: |
        Idempotent on `clientTransferId`, for as long as the treasury keeps the account's transfers: resending the same
        request returns the transfer it created, in whatever state it has reached. The same ID with a different kind,
        amount or method is refused with `CLIENT_TRANSFER_ID_REUSED`. After a 503 the outcome is unknown; resend with
        the same `clientTransferId`.

        A deposit adds to available cash only once the bank has settled it, which on most rails is after this answers
        `pending`. A withdrawal is taken out of available cash first, normally before this answers: if the sequencer
        group refuses because the amount is more than the account's available cash, the transfer is `failed` with
        reason `insufficient_available_cash` and nothing moved. That refusal is the engine's sequenced decision, so it
        is answered with HTTP 200 and the transfer, as a rejected order is.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferRequest' }
      responses:
        '200':
          description: The transfer, new or the one this `clientTransferId` already created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/TreasuryUnavailable' }
    get:
      operationId: listTransfers
      security:
        - apiKey: [read]
        - devToken: []
      tags: [transfers]
      summary: The account's transfers, newest first
      parameters:
        - name: limit
          in: query
          description: At most this many transfers.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: The newest transfers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfers' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/TreasuryUnavailable' }
  /v4/transfers/{transferId}:
    get:
      operationId: getTransfer
      security:
        - apiKey: [read]
        - devToken: []
      tags: [transfers]
      summary: One of the account's transfers
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: The transfer as it stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/TreasuryUnavailable' }
    delete:
      operationId: cancelTransfer
      security:
        - apiKey: [transfers]
        - devToken: []
      tags: [transfers]
      summary: Cancel a transfer the bank has not yet decided
      description: |
        Only a `pending` transfer that is still waiting on the bank can be cancelled; anything else is refused with
        `TRANSFER_NOT_CANCELLABLE`. A cancelled withdrawal returns its amount to available cash before it answers.
      parameters:
        - $ref: '#/components/parameters/TransferId'
      responses:
        '200':
          description: The transfer, cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/TreasuryUnavailable' }
  /v4/rfqs:
    get:
      operationId: listOpenRfqs
      tags: [rfq]
      summary: The requests open now that this responder may quote (approved responders only)
      description: |
        Every request whose window is still open, oldest first, except the account's own, whatever filters its
        sessions subscribed with. What a WebSocket `subscribeRfqs` catches up with, for a client without a session.
        The requester is not named. A parlay service that restarted has forgotten the requests open before it did.
      security:
        - apiKey: [respond]
        - devToken: []
      responses:
        '200':
          description: The open requests.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenRfqs' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotResponder' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: requestQuote
      security:
        - apiKey: [trade]
        - devToken: []
      tags: [rfq]
      summary: Request quotes for a parlay, listing it if it does not exist yet
      description: |
        The legs are put in canonical order and must be on different events and on open markets. The parlay's ID is
        a hash of them, so the same legs always name the same instrument. The request is sent, without the
        requester's identity, to every session of an approved responder that has subscribed and whose filters it
        passes; `responders` says how many accounts that was. Responders quote by attaching resting sells of the
        parlay.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RfqRequest' }
      responses:
        '200':
          description: The open request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rfq' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v4/rfqs/{requestId}:
    get:
      operationId: getRfq
      security:
        - apiKey: [read]
        - devToken: []
      tags: [rfq]
      summary: One of the account's own requests, with its quotes
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The request and every quote attached to it, open or not.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RfqStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v4/rfqs/{requestId}/quotes:
    post:
      operationId: attachQuote
      security:
        - apiKey: [trade, respond]
        - devToken: []
      tags: [rfq]
      summary: Attach a resting order to a request as a quote (approved responders only)
      description: |
        The order must be this account's resting sell of YES on the request's parlay, the request must be another
        account's, and its window must still be open. The quote is the order: it lapses, fills or is cancelled as the
        order does. A responder need not be subscribed to quote, only approved.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteAttach' }
      responses:
        '200':
          description: The attached quote, as the requester is sent it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NotResponder' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v4/keys:
    post:
      operationId: createKey
      security:
        - apiKey: [keys]
        - devToken: []
      tags: [keys]
      summary: Create an API key for the account
      description: |
        The answer is the only time the secret is shown: the venue keeps a hash of it. A key calling this cannot give
        the new key a permission it does not hold itself, nor let it expire after it does (403 `FORBIDDEN`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyRequest' }
      responses:
        '200':
          description: The new key, with its secret and credential.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
    get:
      operationId: listKeys
      security:
        - apiKey: [keys]
        - devToken: []
      tags: [keys]
      summary: Every API key of the account, newest first, revoked and expired ones included
      responses:
        '200':
          description: The keys, without their secrets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Keys' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
  /v4/keys/{keyId}:
    delete:
      operationId: revokeKey
      security:
        - apiKey: [keys]
        - devToken: []
      tags: [keys]
      summary: Revoke one of the account's API keys, for good
      description: |
        Takes effect at once in the identity service, and at every gateway within 10 seconds (README): REST calls with
        the key are refused, and private sessions logged in with it are closed. Revoking a key already revoked answers
        the key as it is. A key can revoke itself.
      parameters:
        - $ref: '#/components/parameters/KeyId'
      responses:
        '200':
          description: The key, revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Key' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/IdentityUnavailable' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: '<keyId>.<secret>'
      description: |
        An API key's credential: `Authorization: Bearer ak_0123456789abcdef.<64 hex digits>` (README, API keys and
        permissions). A requirement names the permissions the key must hold, each of `read`, `trade`, `transfers`,
        `keys` and `respond`.
        A valid key without it is refused with 403 `FORBIDDEN`; a missing, unknown, revoked or expired one with 401.
    devToken:
      type: http
      scheme: bearer
      description: |
        Test environments only: a fixed token per account from the environment's catalogue, holding every permission.
        Real identity is interface 6 and the issuer named in the environment manifest (interface 22), neither
        specified yet.
  parameters:
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RfqId' }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/KeyId' }
  responses:
    BadRequest:
      description: Refused at the edge; nothing was journaled.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No valid token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        The credential is valid but lacks the permission this call needs, which the message names; or a key tried to
        create a key with more than it holds. A dev token never gets this.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotResponder:
      description: >-
        `FORBIDDEN`: the account is not approved as a parlay responder by the parlay service's operator, or the
        credential lacks the `respond` permission. Approval is per account and changes only through the operator.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request contradicts what already exists, such as a client transfer ID used for another transfer.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >-
        No such market, no such resting order of this account, no such transfer of this account, no such request, or no
        such key of this account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: The session's flood limit (blueprint §12). Not journaled; retry after the stated delay.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: |
        The sequencer group did not answer: the outcome is unknown, so resend with the same client order ID. For a
        request for quote, the parlay service did not answer; nothing was requested, and the request can be sent again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TreasuryUnavailable:
      description: The treasury did not answer. The outcome is unknown; resend with the same client transfer ID.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdentityUnavailable:
      description: |
        The identity service did not answer, or this gateway has none. For a key being created, the outcome is
        unknown: list the keys, and revoke any that was made.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Id:
      type: string
      pattern: '^[0-9]{1,20}$'
      description: A 64-bit identifier or sequence number, as a decimal string so no client loses precision.
    Rational:
      type: string
      pattern: '^[0-9]+/[1-9][0-9]*$'
      description: An exact probability, numerator over denominator, in lowest terms on output.
    PriceInput:
      description: |
        The price of the outcome the order names, in exactly one form. It must equal a row of the instrument's ladder
        exactly; the gateway never rounds (blueprint §6). `tick` is that row's ordinal.
      oneOf:
        - type: object
          required: [tick]
          additionalProperties: false
          properties:
            tick: { type: integer, minimum: 0 }
        - type: object
          required: [probability]
          additionalProperties: false
          properties:
            probability: { $ref: '#/components/schemas/Rational' }
        - type: object
          required: [cents]
          additionalProperties: false
          properties:
            cents: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$', description: 'Price per $1 contract, for example "53" or "0.5".' }
        - type: object
          required: [american]
          additionalProperties: false
          properties:
            american: { type: string, pattern: '^[+-][1-9][0-9]*$', description: 'American odds, for example "-110" or "+150".' }
    PriceQuote:
      type: object
      required: [tick, probability, cents]
      properties:
        tick: { type: integer, minimum: 0 }
        probability: { $ref: '#/components/schemas/Rational' }
        cents: { type: string, description: 'Exact when it terminates within four decimal places, else rounded for display only.' }
        american: { type: [string, 'null'], description: 'American odds when they are a whole number, else null.' }
    Side:
      type: string
      enum: [buy, sell]
      description: Canonical YES terms. Buying NO is selling YES at the complementary price.
    OrderRequest:
      type: object
      required: [clientOrderId, instrumentId, action, outcome, price]
      additionalProperties: false
      properties:
        clientOrderId:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[!-~]+$'
          description: Printable ASCII, unique per account for two hours across every market.
        instrumentId: { $ref: '#/components/schemas/Id' }
        action: { type: string, enum: [buy, sell] }
        outcome: { type: string, enum: ['yes', 'no'] }
        price: { $ref: '#/components/schemas/PriceInput' }
        quantity:
          type: integer
          minimum: 1
          maximum: 4294967295
          description: Contracts. Exactly one of `quantity` and `stakeCents`.
        stakeCents:
          type: integer
          minimum: 1
          description: |
            Buys only: the money to spend. Converted to contracts at the price exactly; a stake that does not buy a
            whole number of lots is refused with `STAKE_NOT_ON_STEP`, whose details name the step.
        timeInForce: { type: string, enum: [GTC, GTD, IOC, FOK], default: GTC }
        expiresAt: { type: string, format: date-time, description: Required exactly when `timeInForce` is GTD. }
        postOnly: { type: boolean, default: false }
        reduceOnly: { type: boolean, default: false }
        protectionTicks: { type: integer, minimum: 0, maximum: 255, default: 0 }
        spendCapCents: { type: integer, minimum: 1, description: Buys only (spec E-9.3 check 1). }
        clientOrderGroup: { type: integer, minimum: 0, maximum: 4294967295 }
        atEventStart: { type: string, enum: [cancel, keep], default: cancel }
      oneOf:
        - required: [quantity]
        - required: [stakeCents]
    AmendRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        price: { $ref: '#/components/schemas/PriceInput' }
        outcome: { type: string, enum: ['yes', 'no'], default: 'yes', description: The outcome `price` is expressed in. }
        quantity: { type: integer, minimum: 1, maximum: 4294967295 }
        atEventStart: { type: string, enum: [cancel, keep] }
    OrderResult:
      type: object
      required: [status, sequence, executions]
      properties:
        status:
          type: string
          enum: [accepted, rejected, duplicate, amended, cancelled]
        sequence: { $ref: '#/components/schemas/Id' }
        orderId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        rejectReason:
          type: [string, 'null']
          description: The engine's reason in lower snake case, for example `insufficient_sleeve`.
        executions:
          type: array
          items: { $ref: '#/components/schemas/Execution' }
    CancelAllResult:
      type: object
      required: [sequence, executions]
      properties:
        sequence: { $ref: '#/components/schemas/Id' }
        executions:
          type: array
          items: { $ref: '#/components/schemas/Execution' }
    Execution:
      type: object
      description: One change to one of the account's orders, in canonical YES terms.
      required: [type, sequence, orderId, instrumentId]
      properties:
        type: { type: string, enum: [accepted, rejected, fill, cancelled, reduced, amended] }
        sequence: { $ref: '#/components/schemas/Id' }
        orderId: { oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        clientOrderId: { type: string }
        instrumentId: { $ref: '#/components/schemas/Id' }
        side: { $ref: '#/components/schemas/Side' }
        price: { $ref: '#/components/schemas/PriceQuote' }
        quantity: { type: integer, description: 'accepted: the order quantity; fill: contracts filled; cancelled: contracts cancelled.' }
        remaining: { type: integer }
        reason: { type: string, description: 'rejected and cancelled: the engine reason in lower snake case.' }
        tradeId: { $ref: '#/components/schemas/Id' }
        role: { type: string, enum: [maker, taker] }
        cashCents: { type: integer, description: 'fill: the change in this account''s cash, before its fee.' }
        feeCents: { type: integer, description: 'fill: the fee this account paid at its own maker or taker rate, taken from its cash on top of cashCents; negative for a rebate (spec E-10.11). Fees are not reserved, so one can leave available cash below zero.' }
    Position:
      type: object
      required: [instrumentId, position]
      properties:
        instrumentId: { $ref: '#/components/schemas/Id' }
        position: { type: integer, description: Signed YES contracts; negative holds NO. }
    RestingOrder:
      type: object
      required: [orderId, clientOrderId, instrumentId, eventId, side, price, quantity, remaining, filled, filledYesCents]
      properties:
        orderId: { $ref: '#/components/schemas/Id' }
        clientOrderId: { type: string, description: The ID the order was placed with; an amendment keeps it. }
        instrumentId: { $ref: '#/components/schemas/Id' }
        eventId: { $ref: '#/components/schemas/Id' }
        side: { $ref: '#/components/schemas/Side' }
        price: { $ref: '#/components/schemas/PriceQuote' }
        quantity: { type: integer, description: 'The order''s whole size: filled plus remaining, after any amendment or reduction.' }
        remaining: { type: integer }
        filled: { type: integer, description: Contracts filled so far. }
        filledYesCents: { type: integer, description: 'The YES cost of the filled contracts in cents (spec E-2.4); divided by filled, the average YES price in cents.' }
    Account:
      type: object
      required: [accountId, sequence, availableCents, reservedCents, positions, orders]
      properties:
        accountId: { $ref: '#/components/schemas/Id' }
        sequence: { $ref: '#/components/schemas/Id' }
        availableCents: { type: integer }
        reservedCents: { type: integer }
        positions: { type: array, items: { $ref: '#/components/schemas/Position' } }
        orders: { type: array, items: { $ref: '#/components/schemas/RestingOrder' } }
    TransferRequest:
      type: object
      required: [clientTransferId, kind, amountCents, method]
      additionalProperties: false
      properties:
        clientTransferId:
          type: string
          minLength: 1
          maxLength: 32
          pattern: '^[!-~]+$'
          description: Printable ASCII, unique per account. Never reusable, even by a transfer that failed.
        kind: { type: string, enum: [deposit, withdrawal] }
        amountCents:
          type: integer
          minimum: 1
          description: An environment may refuse an amount above its per-transfer limit with `BAD_REQUEST`.
        method: { $ref: '#/components/schemas/TransferMethod' }
    TransferMethod:
      type: string
      enum: [dummy_bank, dummy_instant, dummy_failing]
      description: |
        The rail the money moves on. Test environments offer only the fake provider's (blueprint §16): `dummy_bank`
        is decided by the bank after a delay and occasionally fails, `dummy_instant` settles at once, and
        `dummy_failing` always fails at the bank. Real rails join this list as they are integrated.
    TransferState:
      type: string
      enum: [pending, settled, failed, cancelled]
      description: |
        `pending` until the transfer is final, then exactly one of the others, never to change again. A settled
        deposit has been added to available cash; a settled withdrawal has left the venue. A failed or cancelled
        deposit never added anything, and a failed or cancelled withdrawal has returned its amount to available cash.
    TransferReason:
      type: string
      enum: [declined_by_bank, returned_by_bank, insufficient_available_cash, cancelled_by_client]
      description: |
        Why a transfer failed or was cancelled. `declined_by_bank`: the bank refused a deposit. `returned_by_bank`:
        the bank could not pay a withdrawal out. `insufficient_available_cash`: the sequencer group refused to take a
        withdrawal from available cash. `cancelled_by_client`: a cancel request.
    Transfer:
      type: object
      required: [transferId, clientTransferId, kind, amountCents, method, state, reason, sequence, createdAt, updatedAt]
      properties:
        transferId: { $ref: '#/components/schemas/Id' }
        clientTransferId: { type: string }
        kind: { type: string, enum: [deposit, withdrawal] }
        amountCents: { type: integer, minimum: 1 }
        method: { $ref: '#/components/schemas/TransferMethod' }
        state: { $ref: '#/components/schemas/TransferState' }
        reason:
          oneOf: [{ $ref: '#/components/schemas/TransferReason' }, { type: 'null' }]
          description: Set exactly when the state is failed or cancelled.
        sequence:
          oneOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
          description: |
            The input that last changed available cash for this transfer, whose `account` message carries the new
            balance: the grant of a settled deposit, the reclaim of a pending or settled withdrawal, or the grant that
            returned a failed or cancelled one. Null while nothing has moved.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: When the state, reason or sequence last changed. }
    Transfers:
      type: object
      required: [transfers]
      properties:
        transfers: { type: array, items: { $ref: '#/components/schemas/Transfer' }, description: Newest first. }
    Level:
      type: object
      required: [price, quantity, orders]
      properties:
        price: { $ref: '#/components/schemas/PriceQuote' }
        quantity: { type: integer }
        orders: { type: integer }
    Book:
      type: object
      required: [instrumentId, sequence, state, bids, asks]
      properties:
        instrumentId: { $ref: '#/components/schemas/Id' }
        sequence: { $ref: '#/components/schemas/Id' }
        state: { $ref: '#/components/schemas/MarketState' }
        bids: { type: array, items: { $ref: '#/components/schemas/Level' }, description: Best first. }
        asks: { type: array, items: { $ref: '#/components/schemas/Level' }, description: Best first. }
        last: { oneOf: [{ $ref: '#/components/schemas/PriceQuote' }, { type: 'null' }] }
    MarketState:
      type: string
      enum: [listed, open, halted, closed, resolving, settled, voided]
    Market:
      type: object
      required: [instrumentId, label, class, state, lotStep, ladder]
      properties:
        instrumentId: { $ref: '#/components/schemas/Id' }
        label: { type: string }
        class: { type: string, enum: [binary, categorical_outcome, scalar_band, parlay] }
        state: { $ref: '#/components/schemas/MarketState' }
        lotStep: { type: integer, minimum: 1 }
        ladder: { type: array, items: { $ref: '#/components/schemas/PriceQuote' } }
        legs:
          type: array
          description: Parlays only, in canonical order. The parlay pays $1 if every leg resolves as given.
          items: { $ref: '#/components/schemas/ParlayLeg' }
    ParlayLegInput:
      type: object
      required: [instrumentId, outcome]
      additionalProperties: false
      properties:
        instrumentId: { $ref: '#/components/schemas/Id' }
        outcome: { type: string, enum: ['yes', 'no'], description: The leg holds when this outcome of the market happens. }
    ParlayLeg:
      type: object
      required: [eventId, instrumentId, outcome, title, label]
      properties:
        eventId: { $ref: '#/components/schemas/Id' }
        instrumentId: { $ref: '#/components/schemas/Id' }
        outcome: { type: string, enum: ['yes', 'no'] }
        title: { type: string, description: The leg's event. }
        label: { type: string, description: The leg's market. }
    KeyId:
      type: string
      pattern: '^ak_[0-9a-f]{16}$'
      description: An API key's public ID.
    Permission:
      type: string
      enum: [read, trade, transfers, keys, respond]
      description: |
        `read`: the account, its transfers and requests, and private sessions. `trade`: orders, amendments, cancels,
        requests for quote and quotes. `transfers`: deposits, withdrawals and their cancellation. `keys`: this
        account's API keys. `respond`: answering requests for quote as an approved responder (subscribing, reading
        those open, and, with `trade`, attaching quotes).
    KeyRequest:
      type: object
      required: [label, permissions]
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[ -~]+$'
          description: What the key is for, in the owner's words. Printable ASCII.
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/Permission' }
          description: Must include `read`.
        expiresAt:
          type: string
          format: date-time
          description: When the key stops working, in UTC (`Z`), in the future. Omitted, it works until revoked.
    Key:
      type: object
      required: [keyId, label, permissions, createdAt, expiresAt, revokedAt, lastUsedAt, createdBy]
      properties:
        keyId: { $ref: '#/components/schemas/KeyId' }
        label: { type: string }
        permissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time, description: Null for a key that never expires. }
        revokedAt: { type: [string, 'null'], format: date-time, description: Null while the key is not revoked. }
        lastUsedAt:
          type: [string, 'null']
          format: date-time
          description: When a gateway last checked the key, to within a minute; null if never used.
        createdBy:
          type: [string, 'null']
          pattern: '^ak_[0-9a-f]{16}$'
          description: The key that created this one, or null when a dev token or an operator did.
    KeyCreated:
      allOf:
        - $ref: '#/components/schemas/Key'
        - type: object
          required: [secret, credential]
          properties:
            secret:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: Shown this once. The venue cannot show it again.
            credential:
              type: string
              description: '`keyId.secret`, as REST, WebSocket and FIX take it.'
    Keys:
      type: object
      required: [keys]
      properties:
        keys: { type: array, items: { $ref: '#/components/schemas/Key' }, description: Newest first. }
    RfqId:
      type: string
      pattern: '^[0-9a-z]{1,32}$'
      description: Names a request for quote. Chosen by the parlay service.
    RfqRequest:
      type: object
      required: [legs, quantity]
      additionalProperties: false
      properties:
        legs: { type: array, minItems: 2, maxItems: 6, items: { $ref: '#/components/schemas/ParlayLegInput' } }
        quantity:
          type: integer
          minimum: 1
          maximum: 4294967295
          description: >-
            Contracts wanted, a multiple of the parlay's lot step (10) and at least the venue's minimum request, which
            the parlay service is configured with (10, one lot, unless the environment says otherwise).
    Rfq:
      type: object
      required: [requestId, instrumentId, eventId, legs, quantity, lotStep, openedAt, expiresAt]
      properties:
        requestId: { $ref: '#/components/schemas/RfqId' }
        instrumentId: { $ref: '#/components/schemas/Id' }
        eventId: { $ref: '#/components/schemas/Id' }
        legs: { type: array, items: { $ref: '#/components/schemas/ParlayLeg' } }
        quantity: { type: integer, minimum: 1 }
        lotStep: { type: integer, minimum: 1 }
        listed: { type: boolean, description: 'True when this request listed the parlay; false when it already existed.' }
        responders:
          type: integer
          minimum: 0
          description: >-
            In the answer to the requester only: how many responder accounts the request was sent to, none of them
            named. Zero means nobody will quote unless a responder subscribes or lists open requests within the window.
        openedAt: { type: string, format: date-time, description: The sequencer's time when the request opened. }
        expiresAt:
          type: string
          format: date-time
          description: The end of the window in which quotes can be attached, in the sequencer's time.
    OpenRfqs:
      type: object
      required: [requests]
      properties:
        requests: { type: array, items: { $ref: '#/components/schemas/Rfq' } }
    RfqFilters:
      type: object
      additionalProperties: false
      description: >-
        Which requests a subscription is sent. Every field is optional, and every one given must hold: the number of
        legs within `minLegs` and `maxLegs`, at least one leg on an event of `eventIds` if it is given, at least one
        leg on a market of `instrumentIds` if it is given, and a quantity of at least `minQuantity`.
      properties:
        minLegs: { type: integer, minimum: 2, maximum: 6, default: 2 }
        maxLegs: { type: integer, minimum: 2, maximum: 6, default: 6 }
        eventIds: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }
        instrumentIds: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }
        minQuantity: { type: integer, minimum: 0, maximum: 4294967295, default: 0 }
    RfqSubscription:
      type: object
      required: [subscribed]
      description: The answer to `subscribeRfqs` and `unsubscribeRfqs`.
      properties:
        subscribed: { type: boolean }
        filters:
          allOf: [{ $ref: '#/components/schemas/RfqFilters' }]
          description: On subscribing, the filters in force, every default filled in.
        openRequests:
          type: integer
          minimum: 0
          description: On subscribing, how many open requests were sent to the session, as `rfq` messages, ahead of this reply.
    RfqStatus:
      allOf:
        - $ref: '#/components/schemas/Rfq'
        - type: object
          required: [open, quotes]
          properties:
            open: { type: boolean, description: Whether quotes can still be attached. }
            quotes: { type: array, items: { $ref: '#/components/schemas/Quote' } }
    QuoteAttach:
      type: object
      required: [orderId]
      additionalProperties: false
      properties:
        orderId: { $ref: '#/components/schemas/Id' }
    Quote:
      type: object
      description: A resting sell of YES on a parlay's book, attached to a request. The responder is not named.
      required: [requestId, orderId, instrumentId, price, quantity, filled, state]
      properties:
        requestId: { $ref: '#/components/schemas/RfqId' }
        orderId: { $ref: '#/components/schemas/Id' }
        instrumentId: { $ref: '#/components/schemas/Id' }
        price: { $ref: '#/components/schemas/PriceQuote' }
        quantity: { type: integer, minimum: 0, description: Remaining quantity, the contracts of this quote not yet bought. }
        filled:
          type: integer
          minimum: 0
          description: Filled quantity, the contracts of this quote bought so far by anyone. A quote taken in full is `filled` with `quantity` 0 and `filled` its size.
        expiresAt:
          type: [string, 'null']
          format: date-time
          description: When the order lapses, for a GTD order; null for one that rests until cancelled.
        state:
          type: string
          enum: [open, filled, expired, cancelled]
          description: '`cancelled` covers every other way an order leaves the book, a market closing included.'
    Event:
      type: object
      required: [eventId, title, outcomes, started, suspended, ended, resolved, markets]
      properties:
        eventId: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        outcomes: { type: array, items: { type: string } }
        started: { type: boolean }
        suspended: { type: boolean }
        ended: { type: boolean }
        resolved: { type: boolean }
        markets: { type: array, items: { $ref: '#/components/schemas/Market' } }
        scheduledStart:
          type: [string, 'null']
          format: date-time
          description: When the event is scheduled to start, as listed; null if it was listed without one.
        resolution:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Resolution'
    Resolution:
      type: object
      description: |
        How an event was resolved (spec E-15.4). A void reverses every trade in the event; anything built on the event,
        such as a parlay with it as a leg, follows this rather than the markets' states alone.
      required: [kind, at]
      properties:
        kind: { type: string, enum: [resolved, void] }
        winningState: { type: integer, minimum: 0, description: The index into `outcomes` that occurred. Resolved only. }
        outcome: { type: string, description: That outcome's name. Resolved only. }
        at: { type: string, format: date-time, description: The sequencer's time. }
    Markets:
      type: object
      required: [sequence, events]
      properties:
        sequence: { $ref: '#/components/schemas/Id' }
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - PRICE_NOT_ON_LADDER
                - STAKE_NOT_ON_STEP
                - CLIENT_TRANSFER_ID_REUSED
                - TRANSFER_NOT_CANCELLABLE
                - RATE_LIMITED
                - UNAVAILABLE
            message: { type: string }
            details: { type: object }
